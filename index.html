<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f9a8d4">
<title>Times Table Quest: The Muddle Monster</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",system-ui,sans-serif;color:#1e1b4b;
 background:linear-gradient(160deg,#7dd3fc 0%,#c4b5fd 55%,#fbcfe8 100%);background-attachment:fixed;min-height:100vh;-webkit-user-select:none;user-select:none}
body.theme-emi{background:linear-gradient(160deg,#ede9fe 0%,#ddd6fe 40%,#e9d5ff 72%,#f5d0fe 100%);background-attachment:fixed}
body.theme-blu{background:linear-gradient(160deg,#bae6fd 0%,#93c5fd 40%,#c4b5fd 75%,#fde68a 100%);background-attachment:fixed}
#top{display:flex;align-items:center;gap:6px;padding:8px 10px;background:rgba(255,255,255,.7);position:sticky;top:0;z-index:20;box-shadow:0 2px 8px #0001}
#top .title{font-weight:800;font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{font-weight:800;font-size:17px;background:#fff;border-radius:14px;padding:6px 10px;white-space:nowrap}
.iconbtn{font-size:21px;border:none;background:#fff;border-radius:14px;width:44px;height:44px;box-shadow:0 3px 0 #0002;cursor:pointer;flex:none;padding:0}
.iconbtn.off{opacity:.45;filter:grayscale(1)}
#app{max-width:900px;margin:0 auto;padding:14px 12px 40px}
.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 0 #0000000f,0 10px 30px #0000001a;margin-bottom:14px}
.btn{font:inherit;font-weight:800;font-size:22px;border:none;border-radius:18px;padding:12px 24px;background:#f97316;color:#fff;box-shadow:0 5px 0 #c2410c;cursor:pointer;min-height:60px;transition:transform .08s;margin:6px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c2410c}
.btn.green{background:#22c55e;box-shadow:0 5px 0 #15803d}
.btn.blue{background:#3b82f6;box-shadow:0 5px 0 #1d4ed8}
.btn.purple{background:#8b5cf6;box-shadow:0 5px 0 #6d28d9}
.btn.pink{background:#ec4899;box-shadow:0 5px 0 #be185d}
.btn.gray{background:#94a3b8;box-shadow:0 5px 0 #64748b}
.btn.sm{font-size:18px;min-height:48px;padding:8px 16px}
.hidden{display:none!important}
h1{font-size:42px;margin:.15em 0;text-align:center;color:#7c3aed;text-shadow:3px 3px 0 #fde68a}
h2{font-size:28px;margin:.2em 0}
.center{text-align:center}
.big{font-size:22px;line-height:1.4}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.between{justify-content:space-between}
.bigemoji{font-size:80px;line-height:1.1}
.bob{display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
input.nm{font:inherit;font-size:24px;padding:12px 16px;border-radius:16px;border:3px solid #c4b5fd;width:min(320px,90%);text-align:center;margin:10px 0;-webkit-user-select:text;user-select:text}
/* heroes */
svg.hero{display:block;overflow:visible;width:100%;height:auto}
svg.hero.idle{animation:bob 2.4s ease-in-out infinite}
svg.hero.cheer{animation:jump .5s ease 2}
svg.hero.sad{animation:wob .6s ease 2}
svg.hero.strut{animation:strut 1.4s ease-in-out infinite}
svg.hero.dance{animation:dance2 .6s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-26px) scale(1.05)}}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes strut{0%,100%{transform:translateX(-22px) rotate(-4deg)}50%{transform:translateX(22px) rotate(4deg)}}
@keyframes dance2{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-10px)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.herocards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.herocard{font:inherit;border:none;background:#fff;border-radius:26px;padding:14px;cursor:pointer;box-shadow:0 7px 0 #0002;color:#1e1b4b}
.herocard.emi{background:linear-gradient(#fdf2f8,#fae8ff);box-shadow:0 7px 0 #f472b6}
.herocard.blu{background:linear-gradient(#eff6ff,#fef9c3);box-shadow:0 7px 0 #60a5fa}
.herocard:active{transform:translateY(4px)}
.herocard .hsv{width:min(180px,100%);margin:0 auto}
.herocard .hn{font-size:24px;font-weight:900}
.herocard .ht{font-size:16px;color:#7c3aed;font-weight:800}
.herocard .hl{font-size:15px;color:#475569;margin-top:4px}
/* map */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:14px}
.lvl{font:inherit;border:none;border-radius:22px;padding:10px 6px;background:#fff;box-shadow:0 6px 0 #a78bfa;cursor:pointer;color:#1e1b4b;position:relative}
.lvl:active{transform:translateY(3px)}
.lvl .lch{font-size:13px;font-weight:800;color:#64748b}
.lvl .lnum{font-size:30px;font-weight:900;color:#7c3aed}
.lvl .lboss{font-size:34px;height:44px;display:flex;align-items:center;justify-content:center}
.lvl .lboss svg{width:44px;height:44px}
.lvl .lplace{font-size:13px;font-weight:800;color:#475569;min-height:32px}
.lvl .lstars{font-size:20px;color:#f59e0b;letter-spacing:2px}
.lvl.locked{background:#e2e8f0;box-shadow:0 6px 0 #94a3b8;cursor:not-allowed}
.lvl.locked .lnum{color:#94a3b8}
.lvl.done{background:#fef9c3;box-shadow:0 6px 0 #f59e0b}
.lvl.final{outline:3px dashed #7c3aed}
.lvl.next{animation:glow 1.5s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 6px 0 #a78bfa,0 0 0 0 #f9731688}50%{box-shadow:0 6px 0 #a78bfa,0 0 0 10px #f9731600}}
.tag{position:absolute;top:-8px;right:-4px;background:#f97316;color:#fff;font-size:13px;border-radius:10px;padding:2px 8px;font-weight:800}
.maphead{display:flex;align-items:center;gap:12px;text-align:left}
.maphead .mh{width:90px;flex:none}
/* scenes */
.scene{position:relative;height:340px;border-radius:24px;overflow:hidden;box-shadow:0 6px 0 #0000001a}
.scenetitle{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fffd;border-radius:999px;padding:4px 14px;font-weight:900;white-space:nowrap;font-size:17px;z-index:4;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.prop{position:absolute;font-size:38px;cursor:pointer;z-index:5;filter:drop-shadow(0 3px 2px #0003);line-height:1;padding:4px}
.prop.star{filter:grayscale(1) opacity(.55)}
.prop.star.lit{filter:drop-shadow(0 0 12px #fde047);animation:twinkle 1s ease-in-out infinite}
.prop.fruit{filter:grayscale(.8)}
.prop.fruit.awake{filter:drop-shadow(0 3px 2px #0003)}
.prop.dance{animation:dance2 .45s ease-in-out 4}
.prop.bloom{animation:pop .4s}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(15deg)}}
.wake{display:inline-block;background:#fef3c7;color:#92400e;border-radius:12px;padding:2px 10px;font-weight:900;font-size:14px;margin-left:6px}
.cast{position:absolute;bottom:4px;left:80px;right:6px;display:flex;justify-content:center;align-items:flex-end;gap:6px;z-index:3;pointer-events:none}
.castm{width:130px;transition:transform .2s}
.castm.side{width:100px}
.castm.bossm{width:120px;text-align:center;font-size:100px;line-height:1}
.castm.talk{transform:translateY(-8px) scale(1.06)}
.owlbox{position:absolute;left:6px;bottom:6px;width:84px;z-index:3;transition:transform .2s}
.owlbox.talk{transform:translateY(-8px) scale(1.08)}
.bubble{background:#fffdf5;border-radius:24px;padding:12px 18px;margin-top:12px;position:relative;border:4px solid #fbbf24;box-shadow:0 6px 0 #f59e0b55;cursor:pointer}
.bubble:before{content:"";position:absolute;top:-18px;left:40px;border:14px solid transparent;border-bottom:0;border-top:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:18px solid #fbbf24}
.who{font-weight:900;color:#7c3aed;font-size:18px}
.btext{font-size:24px;line-height:1.4;min-height:68px;font-weight:700;animation:slidein .35s both}
.brow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lineno{color:#94a3b8;font-weight:800}
.fx{position:fixed;pointer-events:none;font-size:30px;z-index:60;animation:fxfly 1.2s ease-out forwards}
@keyframes fxfly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
/* stage bar */
.stagebar{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.pill{background:#ffffffaa;border-radius:999px;padding:6px 14px;font-weight:800;font-size:17px;color:#64748b}
.pill.on{background:#fff;color:#7c3aed;box-shadow:0 3px 0 #a78bfa}
.pill.lv{background:#7c3aed;color:#fff}
/* blocks */
.gridwrap{display:flex;flex-direction:column;align-items:center;gap:3px;margin:10px 0;transition:transform .45s}
.grow{display:flex;align-items:center;gap:8px}
.blks{display:flex;gap:3px}
.blk{width:var(--s);height:var(--s);border-radius:calc(var(--s)/4);display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 #0002;animation:pop .35s both;cursor:pointer;font-size:calc(var(--s)*.62);line-height:1}
.blk i{font-style:normal}
.blk.tap{animation:tapb .3s}
.dancing .blk{animation:dance2 .5s ease-in-out 3}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes tapb{50%{transform:scale(1.35) rotate(10deg)}}
.sc{min-width:44px;font-weight:900;font-size:18px;background:#fef3c7;border-radius:10px;padding:2px 6px;color:#b45309;animation:pop .35s both}
.spin{transform:rotate(90deg) scale(.6)}
.skip{font-size:22px;font-weight:800;color:#7c3aed;min-height:30px}
.eq{font-size:26px;font-weight:900;margin:8px 0}
.eq.huge{font-size:36px;color:#16a34a}
.trickbox{text-align:left;max-width:520px;margin:10px auto}
.ex{background:#f5f3ff;border-radius:16px;padding:10px 16px;margin:8px 0}
.exh{font-weight:900;color:#7c3aed;font-size:20px}
.step{font-size:24px;font-weight:800;padding:4px 0;animation:slidein .4s both}
@keyframes slidein{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.fingers{display:flex;gap:6px;justify-content:center;align-items:flex-end;height:90px;margin:8px 0}
.finger{width:24px;height:80px;background:#c68642;border-radius:12px 12px 6px 6px;font-size:12px;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;color:#fff}
.finger.down{height:30px;background:#f87171}
.finger.gap{margin-left:16px}
.learnhead{display:flex;align-items:center;justify-content:center;gap:10px}
.minihero{width:80px;flex:none;position:relative}
/* questions */
.qcard{text-align:center}
.lead{font-size:20px;color:#7c3aed;font-weight:800}
.qtext{font-size:46px;font-weight:900;margin:8px 0}
.qtext.story{font-size:24px;line-height:1.4;font-weight:800}
.storypic{font-size:24px;line-height:1.3;margin:6px 0}
.storypic .grp{display:inline-block;background:#fef3c7;border-radius:12px;padding:2px 6px;margin:3px}
.ansbox{display:inline-block;min-width:140px;font-size:46px;font-weight:900;border:4px dashed #a78bfa;border-radius:18px;padding:4px 18px;color:#7c3aed;background:#faf5ff}
.ansbox.ok{border-color:#22c55e;color:#16a34a;background:#dcfce7;border-style:solid}
.ansbox.no{border-color:#ef4444;color:#dc2626;background:#fee2e2;border-style:solid}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:14px auto 0}
.pad button{font:inherit;font-size:30px;font-weight:900;height:62px;border:none;border-radius:16px;background:#ede9fe;color:#4c1d95;box-shadow:0 4px 0 #c4b5fd;cursor:pointer}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #c4b5fd}
.pad .ok{background:#22c55e;color:#fff;box-shadow:0 4px 0 #15803d}
.pad .del{background:#fde68a;box-shadow:0 4px 0 #f59e0b}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:460px;margin:12px auto}
.opt{font:inherit;font-size:34px;font-weight:900;min-height:76px;border:none;border-radius:18px;background:#e0f2fe;color:#075985;box-shadow:0 5px 0 #7dd3fc;cursor:pointer}
.opt:active{transform:translateY(3px)}
.arrs{grid-template-columns:repeat(3,1fr);max-width:600px}
.arrs .opt{display:flex;align-items:center;justify-content:center;padding:8px;min-height:130px;background:#fff7ed;box-shadow:0 5px 0 #fdba74}
.arrs .gridwrap{margin:0;gap:2px}.arrs .blks{gap:2px}.arrs .blk{animation:none;box-shadow:none}
.opt.right{background:#bbf7d0!important;box-shadow:0 5px 0 #22c55e!important}
.opt.wrong{background:#fecaca!important;box-shadow:0 5px 0 #ef4444!important}
.fb{font-size:24px;font-weight:900;min-height:34px;margin-top:10px;text-align:center}
.fb.good{color:#16a34a}.fb.bad{color:#dc2626}
.hint{background:#fffbeb;border:3px dashed #fbbf24;border-radius:18px;padding:10px;margin-top:12px;text-align:center;font-size:20px;font-weight:700}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0}
.dot{width:16px;height:16px;border-radius:50%;background:#e2e8f0}.dot.g{background:#22c55e}.dot.r{background:#f87171}.dot.c{background:#a78bfa}
/* boss */
.bossrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bossside{flex:1;text-align:center}
.bossE{font-size:96px;line-height:1;display:inline-block}
.bossE svg{width:120px;height:120px}
.bossE.hit{animation:hit .5s}
@keyframes hit{0%{transform:none;filter:none}20%{transform:translateX(-14px) rotate(-12deg) scale(.9);filter:brightness(2) saturate(0)}50%{transform:translateX(12px) rotate(10deg)}100%{transform:none}}
.bname{font-weight:900;font-size:19px}
.hpbar{height:22px;background:#fee2e2;border-radius:12px;overflow:hidden;border:3px solid #1e1b4b;max-width:300px;margin:6px auto}
.hpfill{height:100%;background:linear-gradient(90deg,#ef4444,#f97316);transition:width .4s}
.player{text-align:center;width:150px;position:relative;flex:none}
.player .pv{width:110px;margin:0 auto;position:relative}
.pname{font-weight:900;font-size:18px}
.hearts{font-size:30px;letter-spacing:2px}
.shield{position:absolute;left:-14px;right:-14px;top:-10px;bottom:-10px;border-radius:50%;border:5px solid #facc15;background:radial-gradient(#fde04766,#fde04700 70%);animation:shieldA 1.2s forwards;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:40px}
@keyframes shieldA{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.05);opacity:1}80%{opacity:1}100%{opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pow{position:absolute;font-size:60px;animation:powa .8s forwards;pointer-events:none}
@keyframes powa{from{transform:scale(.3);opacity:1}to{transform:scale(1.6) translateY(-40px);opacity:0}}
.starsbig{font-size:70px;color:#f59e0b;letter-spacing:6px}
.starsbig span{display:inline-block;animation:pop .5s both}
.starsbig .off{color:#cbd5e1}
.winheroes{display:flex;justify-content:center;align-items:flex-end;gap:10px}
.winheroes .w1{width:150px}.winheroes .w2{width:105px}
.reward{display:inline-block;background:#fef9c3;border:3px solid #facc15;border-radius:18px;padding:8px 16px;font-size:22px;font-weight:900;margin:6px}
/* closet */
.closethero{width:200px;margin:0 auto;cursor:pointer}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.item{font:inherit;border:none;background:#fff;border-radius:20px;padding:10px;cursor:pointer;box-shadow:0 5px 0 #c4b5fd;color:#1e1b4b}
.item .ie{font-size:42px}.item .in{font-weight:800;font-size:15px}.item .is{font-size:12px;color:#64748b;font-weight:700}
.item.on{background:#dcfce7;box-shadow:0 5px 0 #22c55e}
.item.locked{background:#e2e8f0;box-shadow:0 5px 0 #94a3b8;cursor:not-allowed}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:560px){h1{font-size:32px}.qtext{font-size:38px}.bossE{font-size:72px}.bossE svg{width:90px;height:90px}.bigemoji{font-size:64px}.arrs .opt{min-height:100px}.btn{font-size:20px}
 .scene{height:300px}.castm{width:100px}.castm.side{width:74px}.castm.bossm{width:86px;font-size:72px}.owlbox{width:62px}.cast{left:60px}.btext{font-size:21px}.prop{font-size:32px}
 .player{width:110px}.player .pv{width:84px}.hearts{font-size:24px}#top .title{font-size:16px}.iconbtn{width:40px;height:40px;font-size:19px}}

/* ---- v3: Sage + three heroes ---- */
body.theme-sage{background:linear-gradient(160deg,#fdf2f8 0%,#fbcfe8 42%,#fecdd3 75%,#fef3c7 100%);background-attachment:fixed}
.herocards{grid-template-columns:repeat(2,1fr);max-width:760px;margin:0 auto}
.herocard.sage{background:linear-gradient(#fdf2f8,#fce7f3);box-shadow:0 7px 0 #ec4899}
.herocard .hsv{width:min(170px,100%)}
svg.hero.sing{animation:sing .55s ease-in-out 3}
@keyframes sing{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-7deg) translateY(-8px) scale(1.04)}75%{transform:rotate(7deg) translateY(-8px) scale(1.04)}}
.castm.side2{width:92px}
.castm{min-width:0;flex-shrink:1}
.winheroes .w3{width:105px}
@media (max-width:560px){
 .herocards{grid-template-columns:1fr;gap:12px}
 .herocard{display:grid;grid-template-columns:88px 1fr;grid-template-rows:auto auto auto auto;column-gap:12px;text-align:left;align-items:center;padding:10px 14px}
 .herocard .hsv{grid-row:1/span 4;width:88px}
 .herocard .hn{font-size:22px}.herocard .ht{font-size:15px}.herocard .hl{font-size:13px;margin-top:2px}
 .castm.side2{width:66px}.winheroes .w1{width:120px}.winheroes .w2,.winheroes .w3{width:84px}
}

/* ---- v4: Eshon + signature colours (Emi purple, Sage pink, Blú blue, Eshon green) ---- */
body.theme-eshon{background:linear-gradient(160deg,#f0fdf4 0%,#bbf7d0 42%,#d9f99d 75%,#fef9c3 100%);background-attachment:fixed}
.herocard.emi{background:linear-gradient(#f5f3ff,#ede9fe);box-shadow:0 7px 0 #8b5cf6}
.herocard.blu{background:linear-gradient(#eff6ff,#dbeafe);box-shadow:0 7px 0 #3b82f6}
.herocard.eshon{background:linear-gradient(#f0fdf4,#dcfce7);box-shadow:0 7px 0 #22c55e}
.herocard.emi .ht{color:#6d28d9}.herocard.sage .ht{color:#be185d}.herocard.blu .ht{color:#1d4ed8}.herocard.eshon .ht{color:#15803d}
@media (min-width:561px){.herocard .hsv{width:min(150px,100%)}}
body.theme-emi{--hc:#8b5cf6;--hc2:#6d28d9;--hcl:#f5f3ff}
body.theme-sage{--hc:#ec4899;--hc2:#be185d;--hcl:#fdf2f8}
body.theme-blu{--hc:#3b82f6;--hc2:#1d4ed8;--hcl:#eff6ff}
body.theme-eshon{--hc:#16a34a;--hc2:#166534;--hcl:#f0fdf4}
body[class*=theme-] #top{background:var(--hcl);border-bottom:4px solid var(--hc)}
body[class*=theme-] #top .title{color:var(--hc2)}
body[class*=theme-] h2{color:var(--hc2)}
body[class*=theme-] .btn.pink,body[class*=theme-] .btn.purple,body[class*=theme-] .btn.blue,body[class*=theme-] .btn.green{background:var(--hc);box-shadow:0 5px 0 var(--hc2);color:#fff}
body[class*=theme-] .bubble{border-color:var(--hc)}
body[class*=theme-] .lvl{box-shadow:0 6px 0 var(--hc)}
body[class*=theme-] .tag{background:var(--hc2)}
body[class*=theme-] .item{box-shadow:0 5px 0 var(--hc)}
body[class*=theme-] .item.on{background:var(--hcl);box-shadow:0 5px 0 var(--hc2);outline:3px solid var(--hc)}
body[class*=theme-] .item.locked{box-shadow:0 5px 0 #94a3b8;outline:none}
body[class*=theme-] input.nm{border-color:var(--hc)}
body[class*=theme-] .closetcard{background:var(--hcl);border:4px solid var(--hc)}
svg.hero.draw{animation:draw .5s ease-in-out 3}
@keyframes draw{0%,100%{transform:rotate(0) translateY(0)}30%{transform:rotate(-5deg) translateY(-6px)}60%{transform:rotate(4deg) translateY(-10px) scale(1.05)}}

function singNote(f,d,delay){if(save.muted)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const t=actx.currentTime+(delay||0);const o=actx.createOscillator(),g=actx.createGain(),l=actx.createOscillator(),lg=actx.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);l.frequency.value=6;lg.gain.value=f*.02;l.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.18,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.connect(g);g.connect(actx.destination);o.start(t);l.start(t);o.stop(t+d+.15);l.stop(t+d+.15);}catch(e){}}

let VOICE=null;
const hasTTS=()=>!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
function pickVoice(){try{if(!hasTTS())return;const vs=window.speechSynthesis.getVoices()||[];const en=vs.filter(v=>/^en/i.test(v.lang||''));
 const pref=[/samantha/i,/google uk english female/i,/(aria|jenny|libby|sonia|natasha|ava|emma).*natural/i,/aria|jenny|libby|sonia|ava|emma/i,/karen|moira|tessa|serena|fiona|victoria/i,/zira|hazel|susan/i,/female/i,/google us english/i];
 for(const r of pref){const v=en.find(v=>r.test(v.name));if(v){VOICE=v;return;}}VOICE=en.find(v=>v.localService)||en[0]||null;}catch(e){VOICE=null;}}
try{if(hasTTS()){pickVoice();window.speechSynthesis.addEventListener&&window.speechSynthesis.addEventListener('voiceschanged',pickVoice);}}catch(e){}
function speakClean(t){return String(t).replace(/Blú/g,'Blue').replace(/×/g,' times ').replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}\u{20E3}]/gu,'').replace(/\s+/g,' ').trim();}
function stopConfetti(){parts=[];if(confRAF){cancelAnimationFrame(confRAF);confRAF=0;}cx.clearRect(0,0,cv.width,cv.height);}
function stopSpeech(){try{if(hasTTS())window.speechSynthesis.cancel();}catch(e){}}
function speak(text,who){try{if(!save.narrator||!hasTTS())return;const t=speakClean(text);if(!t)return;stopSpeech();const u=new SpeechSynthesisUtterance(t);if(VOICE){u.voice=VOICE;u.lang=VOICE.lang;}else u.lang='en-US';
 u.rate=who==='boss'?.9:.95;u.pitch=who==='boss'?.6:who==='owl'?1.05:1.35;window.speechSynthesis.speak(u);}catch(e){}}

const cv=$('confetti'),cx=cv.getContext('2d');let parts=[],confRAF=0;
function confetti(){cv.width=innerWidth;cv.height=innerHeight;const pal=(save.hero&&HS().conf)||COLORS;for(let i=0;i<180;i++)parts.push({x:innerWidth/2+rand(-100,100),y:innerHeight/3,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,s:rand(6,12),c:pick(pal),r:Math.random()*6,vr:(Math.random()-.5)*.4,life:180});if(!confRAF)confRAF=requestAnimationFrame(confStep);}
function confStep(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});parts=parts.filter(p=>p.life>0&&p.y<cv.height+40);if(parts.length)confRAF=requestAnimationFrame(confStep);else{confRAF=0;cx.clearRect(0,0,cv.width,cv.height);}}

/* ---------- session (fresh random content per attempt) ---------- */
let S=null;
function makeSession(n,prev){
 const h=P().hist[n]||{};
 const learnK=pick([3,4,5,6,7].filter(x=>x!==h.learnK&&x!==n))||4;
 const flipK=pick([2,3,4,5,6].filter(x=>x!==learnK&&x!==h.flipK&&x!==n))||3;
 let trickKs;
 if(n===11)trickKs=[pick(range(2,9).filter(x=>!(h.trickKs||[]).includes(x))),pick(range(10,12).filter(x=>!(h.trickKs||[]).includes(x)))];
 else{const hi=n===9?10:12;trickKs=shuffle(range(2,hi).filter(x=>!(h.trickKs||[]).includes(x)&&x!==learnK)).slice(0,2);}
 const pool=HCTX[save.hero].concat(CTX);const ctxs=shuffle(pool.filter(c=>!(h.ctx||[]).includes(c.e))).concat(shuffle(pool));
 const hp=bossHP(n),nq=hp+HEARTS-1;
 const last=(h.bossKs||[]).slice(0,hp);
 const fresh=shuffle(range(1,12).filter(x=>!last.includes(x))),old=shuffle(range(1,12).filter(x=>last.includes(x)));
 let base=fresh.concat(old).slice(0,Math.min(hp,12));let bossKs=shuffle(base);while(bossKs.length<nq)bossKs.push(rand(2,12));
 const bt=['fill','mc','array','missing','story','fill','mc','story','fill','missing','mc','array'];
 const bTypes=shuffle(bt.slice(0,hp)).concat(shuffle(['fill','mc','missing','story'])).slice(0,nq);
 const tables=ORDER.filter(x=>x!==1);
 const boss=bossKs.map((k,i)=>makeQ(bTypes[i],(n===12&&i%2===1)?pick(tables):n,k,ctxs[i%ctxs.length]));
 const pKs=shuffle(range(2,12).filter(x=>x!==learnK)).slice(0,5);
 const pTypes=shuffle(['fill','mc','story','array','missing']);
 const practice=pKs.map((k,i)=>makeQ(pTypes[i],n,k,ctxs[(i+nq)%ctxs.length]));
 P().hist[n]={learnK,flipK,trickKs,bossKs,ctx:ctxs.slice(0,6).map(c=>c.e)};persist();
 return {n,learnK,flipK,trickKs,boss,practice,attempt:(prev&&prev.n===n?prev.attempt+1:1)};
}
function makeQ(type,n,k,ctx){
 const flip=Math.random()<.5,a=flip?k:n,b=flip?n:k,p=n*k;const q={type,n,k,a,b,p,ctx};
 if(type==='fill'){q.text=`${a} × ${b} = ?`;q.ans=p;q.input='pad';}
 else if(type==='mc'){q.text=`${a} × ${b} = ?`;q.ans=p;q.input='mc';q.lead='Tap the right answer!';const c=shuffle([p+n,p-n,p+1,p-1,p+k,p-k,p+10,p+2,p-2]).filter((v,i,ar)=>v>0&&v!==p&&ar.indexOf(v)===i).slice(0,3);q.opts=shuffle([p].concat(c));}
 else if(type==='missing'){q.text=Math.random()<.5?`${n} × ? = ${p}`:`? × ${n} = ${p}`;q.ans=k;q.input='pad';q.lead='Find the missing number! 🔍';}
 else if(type==='story'){q.a=k;q.b=n;q.text=`${k===1?'There is 1 '+ctx.g1:'There are '+k+' '+ctx.gs}. Each ${ctx.g1} has ${n} ${n===1?ctx.one:ctx.many} ${ctx.e}. How many ${ctx.many} are there in all?`;q.ans=p;q.input='pad';q.lead='Story problem! 📖';}
 else if(type==='array'){q.text=`Which blocks show ${a} × ${b}?`;q.input='arr';q.lead='Rows × blocks in each row 🧱';
  const cand=shuffle([[a,b+1],[a+1,b],[a,b-1],[a-1,b],[a+1,b+1],[a-1,b+1],[a+1,b-1],[a+2,b]]).filter(([r,c])=>r>=1&&c>=1&&r<=12&&c<=12&&r*c!==a*b);
  const ds=[];cand.forEach(d=>{if(ds.length<2&&!ds.some(x=>x[0]===d[0]&&x[1]===d[1]))ds.push(d);});
  q.opts=shuffle([[a,b]].concat(ds));q.ans=q.opts.findIndex(x=>x[0]===a&&x[1]===b);}
 return q;}
function explain(q){if(q.type==='array')return `It's the one with ${q.a} rows of ${q.b} blocks.`;if(q.type==='missing')return `${q.n} × ${q.k} = ${q.p}, so the missing number is ${q.k}.`;return `${q.a} × ${q.b} = ${q.p}`;}

/* ---------- PRACTICE ---------- */
function practiceStart(){S.pi=0;S.pScore=0;S.pRes=[];renderPractice();}
function dots(res,total){let h='<div class="dots">';for(let i=0;i<total;i++)h+=`<span class="dot ${res[i]===true?'g':res[i]===false?'r':i===res.length?'c':''}"></span>`;return h+'</div>';}
function renderPractice(){const q=S.practice[S.pi];inp='';S.cur=q;S.locked=false;
 show(`${stageBar('practice')}<div class="card"><div class="row between"><div class="row"><div class="minihero" id="mh">${heroSVG(save.hero)}</div><h2>🎯 Practice ${S.pi+1}/${S.practice.length}</h2></div>
 <button class="btn blue sm" id="hintBtn" onclick="showHint()">💡 Hint</button></div>${dots(S.pRes,S.practice.length)}
 ${qHTML(q)}<div id="hint" class="hint hidden"></div><div id="fb" class="fb"></div>
 <div class="row"><button id="nextbtn" class="btn green hidden" data-enter onclick="practiceNext()">Next ▶</button></div></div>`);
 S.onAnswer=ok=>{S.locked=true;S.pRes.push(ok);
  if(ok){S.pScore++;heroRight('#mh');$('fb').className='fb good';$('fb').textContent='🎉 '+cheer();setTimeout(()=>{if(S&&S.cur===q)practiceNext();},1000);}
  else{SFX.bad();heroWrong('#mh');$('fb').className='fb bad';$('fb').innerHTML='Not quite! '+explain(q)+' 💪';showHint(true);$('nextbtn').classList.remove('hidden');}};}
function hintHTML(q,full){const T=TRICKS[q.n];
 if(q.type==='array')return `Look for <b>${q.a} rows</b> with <b>${q.b} blocks</b> in each row.`+(full?gridHTML(q.a,q.b,{anim:false}):'');
 if(q.type==='missing')return `Skip count by ${q.n}s until you reach ${q.p}. How many jumps?`+gridHTML(q.k,q.n,{labels:true})+(full?`<div class="eq">${q.k} jumps ➜ ${q.k}</div>`:'');
 const rows=q.type==='story'?q.k:q.a,cols=q.type==='story'?q.n:q.b;
 return `<div>Trick: ${T.s(q.k).slice(0,-1).join(' ➜ ')||T.d}</div>`+gridHTML(rows,cols,{labels:true,hideLast:!full});}
function showHint(full){const h=$('hint');h.innerHTML='💡 '+hintHTML(S.cur,full);h.classList.remove('hidden');if(!full)SFX.tap();}
function practiceNext(){if(!S)return;if(S.pi>=S.practice.length-1){practiceDone();return;}S.pi++;renderPractice();}
function practiceDone(){S.locked=false;S.cur=null;
 show(`${stageBar('practice')}<div class="card center"><div class="winheroes"><div class="w1" id="mh">${heroSVG(save.hero,'cheer')}</div><div class="w2">${heroSVG(sibId())}</div>${pickExtras('boss').map(x=>`<div class="w3">${heroSVG(x)}</div>`).join('')}</div><h2>Practice done!</h2><p class="big">You got <b>${S.pScore} out of ${S.practice.length}</b>. ${S.pScore>=4?'You are ready!':'Good try! Remember the tricks you learned!'}</p>
 <p class="big">But wait... something is coming... ${S.n===12?'🌀':BOSSES[S.n][0]}</p><button class="btn" data-enter onclick="playScene(midScene(),bossStart)">📖 Continue the story</button>
 <button class="btn gray sm" onclick="learnBuild()">📚 Learn again</button></div>`);}

/* ---------- BOSS ---------- */
function bossStart(){S.hp=bossHP(S.n);S.hearts=HEARTS;S.bi=0;renderBoss();}
function heartStr(){return '❤️'.repeat(S.hearts)+'🖤'.repeat(HEARTS-S.hearts);}
function renderBoss(){const q=S.boss[S.bi],name=BOSSES[S.n][1],max=bossHP(S.n);inp='';S.cur=q;S.locked=false;
 show(`${stageBar('boss')}<div class="card" id="arena" style="position:relative"><div class="bossrow">
 <div class="bossside"><div id="bossE" class="bossE"><span class="bob">${bossFace(S.n)}</span></div><div class="bname">${name}</div>
 <div class="hpbar"><div class="hpfill" id="hpfill" style="width:${S.hp/max*100}%"></div></div><div style="font-weight:800">${S.hp}/${max} HP</div></div>
 <div class="player"><div class="pv" id="pv">${heroSVG(save.hero)}</div><div class="pname">${esc(nm(save.hero))}</div><div class="hearts" id="hearts">${heartStr()}</div></div></div></div>
 <div class="card" id="qbox">${qHTML(q)}<div id="fb" class="fb"></div></div>`);
 S.onAnswer=ok=>{S.locked=true;
  if(ok){S.hp--;SFX.hit();heroRight('#pv');const b=$('bossE');b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');$('hpfill').style.width=(S.hp/max*100)+'%';
   const p=document.createElement('div');p.className='pow';p.textContent=HS().pow;p.style.left='20%';p.style.top='10px';$('arena').appendChild(p);
   $('fb').className='fb good';$('fb').textContent=`${H().power}! ${cheer()}`;setTimeout(()=>{if(!S||S.cur!==q)return;if(S.hp<=0)bossWin();else{S.bi++;renderBoss();}},1000);}
  else{S.hearts--;SFX.bad();heroWrong('#pv');$('hearts').textContent=heartStr();$('qbox').classList.add('shake');
   if(save.hero==='blu'||true){const sh=document.createElement('div');sh.className='shield';sh.textContent=HS().shield;$('pv').appendChild(sh);setTimeout(SFX.shield,200);}
   const hlp=(save.hero==='emi'||save.hero==='blu')?sibId():pick(SIBS[save.hero]),enc=`${nm(hlp)}: ${ENC[hlp]}`;
   $('fb').className='fb bad';$('fb').innerHTML=`Ouch! ${explain(q)}<div style="font-size:18px;color:#7c3aed">${esc(enc)}</div>`;setTimeout(()=>{if(!S||S.cur!==q)return;if(S.hearts<=0)bossLose();else{S.bi++;renderBoss();}},2200);}};}
function bossWin(){const n=S.n,stars=S.hearts,pf=P(),i=ORDER.indexOf(n);const prev=pf.stars[n]||0;pf.stars[n]=Math.max(prev,stars);
 const r=REWARDS[save.hero][i];let newR=null;if(r&&!pf.rewards.includes(r.id)){pf.rewards.push(r.id);newR=r;}persist();SFX.win();confetti();
 playScene(outroScene(newR),()=>winScreen(stars,newR));}
function winScreen(stars,newR){const n=S.n,name=BOSSES[n][1],i=ORDER.indexOf(n),nxt=ORDER[i+1];confetti();
 show(`<div class="card center"><div class="winheroes"><div class="w1" id="wh">${heroSVG(save.hero,HS().win)}</div><div class="w2">${heroSVG(sibId(),'cheer')}</div>${pickExtras('boss').map(x=>`<div class="w3">${heroSVG(x,'cheer')}</div>`).join('')}</div><h1>You WIN!</h1>
 <div class="starsbig">${[0,1,2].map(j=>`<span class="${j<stars?'':'off'}" style="animation-delay:${.2+j*.25}s">★</span>`).join('')}</div>
 <p class="big">${esc(nm(save.hero))}, you beat <b>${name}</b>! You're a <b>×${n} master</b>!<br>${stars===3?'Perfect! Not a single heart lost! 🌟':'Play again to earn all 3 stars!'}</p>
 ${newR?`<div class="reward">New treasure: ${newR.e} ${newR.name}</div><br>`:''}
 ${nxt?`<button class="btn green" data-enter onclick="openLevel(${nxt})">Next: Chapter ${i+2} ▶</button>`:'<p class="big">🎉 You saved the whole Number Kingdom! 🎉</p>'}
 <button class="btn pink" onclick="closetScreen()">${H().closetE} ${H().closet}</button><button class="btn blue" ${nxt?'':'data-enter'} onclick="mapScreen()">🗺️ Map</button></div>`);
 if(save.hero==='blu')SFX.melody();else if(save.hero==='sage')SFX.sing();else if(save.hero==='eshon')SFX.sketch();}
function bossLose(){SFX.lose();playScene(loseScene(),retryLevel);}
function retryLevel(){const n=S.n;S=makeSession(n,S);playScene(introScene(),learnBuild);}

/* ---------- global input ---------- */
function clickEnter(){const b=[...document.querySelectorAll('[data-enter]')].filter(x=>!x.classList.contains('hidden')&&x.offsetParent!==null);if(b.length)b[b.length-1].click();}
document.addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName==='INPUT'){if(e.key==='Enter'){e.preventDefault();clickEnter();}return;}
 const pad=$('pad');
 if(/^[0-9]$/.test(e.key)){if(pad){padPress(e.key);e.preventDefault();}else if($('opts')&&S&&!S.locked){const o=document.querySelectorAll('#opts .opt')[parseInt(e.key,10)-1];if(o){o.click();e.preventDefault();}}}
 else if(e.key==='Backspace'&&pad){padDel();e.preventDefault();}
 else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(pad&&S&&!S.locked&&inp)padOK();else clickEnter();}
});
app.addEventListener('click',e=>{const b=e.target.closest('.blk');if(b&&!b.closest('.opt')){b.classList.remove('tap');void b.offsetWidth;b.classList.add('tap');if(save.hero==='blu')SFX.boop(rand(0,6));else if(save.hero==='sage')SFX.singNote(rand(0,6));else if(save.hero==='eshon')SFX.scribble(rand(0,6));else SFX.tap();}});
$('homeBtn').onclick=()=>{SFX.tap();save.hero?mapScreen():titleScreen();};
$('closetBtn').onclick=()=>{SFX.tap();closetScreen();};
$('muteBtn').onclick=()=>{save.muted=!save.muted;persist();updateStatus();if(!save.muted)SFX.tap();};
$('narrBtn').onclick=()=>{save.narrator=!save.narrator;persist();updateStatus();if(!save.narrator)stopSpeech();else if(SC)replayLine();SFX.tap();};
window.TTQ={get S(){return S;},get SC(){return SC;},get save(){return save;},hasTTS,get voice(){return VOICE?VOICE.name:null;}};
if(save.hero)mapScreen();else titleScreen();
</script>
</body>
