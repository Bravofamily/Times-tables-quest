<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1F44">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap">
<title>NumiRealm: The Muddle Monster</title>
<meta name="application-name" content="NumiRealm">
<meta name="apple-mobile-web-app-title" content="NumiRealm">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",system-ui,sans-serif;color:#1e1b4b;
 background:linear-gradient(160deg,#7dd3fc 0%,#c4b5fd 55%,#fbcfe8 100%);background-attachment:fixed;min-height:100vh;-webkit-user-select:none;user-select:none}
body.theme-emi{background:linear-gradient(160deg,#ede9fe 0%,#ddd6fe 40%,#e9d5ff 72%,#f5d0fe 100%);background-attachment:fixed}
body.theme-blu{background:linear-gradient(160deg,#bae6fd 0%,#93c5fd 40%,#c4b5fd 75%,#fde68a 100%);background-attachment:fixed}
#top{display:flex;align-items:center;gap:6px;padding:8px 10px;background:rgba(255,255,255,.7);position:sticky;top:0;z-index:20;box-shadow:0 2px 8px #0001}
#top .title{font-weight:800;font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{font-weight:800;font-size:17px;background:#fff;border-radius:14px;padding:6px 10px;white-space:nowrap}
.iconbtn{font-size:21px;border:none;background:#fff;border-radius:14px;width:44px;height:44px;box-shadow:0 3px 0 #0002;cursor:pointer;flex:none;padding:0}
.iconbtn.off{opacity:.45;filter:grayscale(1)}
#app{max-width:900px;margin:0 auto;padding:14px 12px 40px}
.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 0 #0000000f,0 10px 30px #0000001a;margin-bottom:14px}
.btn{font:inherit;font-weight:800;font-size:22px;border:none;border-radius:18px;padding:12px 24px;background:#f97316;color:#fff;box-shadow:0 5px 0 #c2410c;cursor:pointer;min-height:60px;transition:transform .08s;margin:6px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c2410c}
.btn.green{background:#22c55e;box-shadow:0 5px 0 #15803d}
.btn.blue{background:#3b82f6;box-shadow:0 5px 0 #1d4ed8}
.btn.purple{background:#8b5cf6;box-shadow:0 5px 0 #6d28d9}
.btn.pink{background:#ec4899;box-shadow:0 5px 0 #be185d}
.btn.gray{background:#94a3b8;box-shadow:0 5px 0 #64748b}
.btn.sm{font-size:18px;min-height:48px;padding:8px 16px}
.hidden{display:none!important}
h1{font-size:42px;margin:.15em 0;text-align:center;color:#7c3aed;text-shadow:3px 3px 0 #fde68a}
h2{font-size:28px;margin:.2em 0}
.center{text-align:center}
.big{font-size:22px;line-height:1.4}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.between{justify-content:space-between}
.bigemoji{font-size:80px;line-height:1.1}
.bob{display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
input.nm{font:inherit;font-size:24px;padding:12px 16px;border-radius:16px;border:3px solid #c4b5fd;width:min(320px,90%);text-align:center;margin:10px 0;-webkit-user-select:text;user-select:text}
/* heroes */
svg.hero{display:block;overflow:visible;width:100%;height:auto}
svg.hero.idle{animation:bob 2.4s ease-in-out infinite}
svg.hero.cheer{animation:jump .5s ease 2}
svg.hero.sad{animation:wob .6s ease 2}
svg.hero.strut{animation:strut 1.4s ease-in-out infinite}
svg.hero.dance{animation:dance2 .6s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-26px) scale(1.05)}}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes strut{0%,100%{transform:translateX(-22px) rotate(-4deg)}50%{transform:translateX(22px) rotate(4deg)}}
@keyframes dance2{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-10px)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.herocards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.herocard{font:inherit;border:none;background:#fff;border-radius:26px;padding:14px;cursor:pointer;box-shadow:0 7px 0 #0002;color:#1e1b4b}
.herocard.emi{background:linear-gradient(#fdf2f8,#fae8ff);box-shadow:0 7px 0 #f472b6}
.herocard.blu{background:linear-gradient(#eff6ff,#fef9c3);box-shadow:0 7px 0 #60a5fa}
.herocard:active{transform:translateY(4px)}
.herocard .hsv{width:min(180px,100%);margin:0 auto}
.herocard .hn{font-size:24px;font-weight:900}
.herocard .ht{font-size:16px;color:#7c3aed;font-weight:800}
.herocard .hl{font-size:15px;color:#475569;margin-top:4px}
/* map */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:14px}
.lvl{font:inherit;border:none;border-radius:22px;padding:10px 6px;background:#fff;box-shadow:0 6px 0 #a78bfa;cursor:pointer;color:#1e1b4b;position:relative}
.lvl:active{transform:translateY(3px)}
.lvl .lch{font-size:13px;font-weight:800;color:#64748b}
.lvl .lnum{font-size:30px;font-weight:900;color:#7c3aed}
.lvl .lboss{font-size:34px;height:44px;display:flex;align-items:center;justify-content:center}
.lvl .lboss svg{width:44px;height:44px}
.lvl .lplace{font-size:13px;font-weight:800;color:#475569;min-height:32px}
.lvl .lstars{font-size:20px;color:#f59e0b;letter-spacing:2px}
.lvl.locked{background:#e2e8f0;box-shadow:0 6px 0 #94a3b8;cursor:not-allowed}
.lvl.locked .lnum{color:#94a3b8}
.lvl.done{background:#fef9c3;box-shadow:0 6px 0 #f59e0b}
.lvl.final{outline:3px dashed #7c3aed}
.lvl.next{animation:glow 1.5s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 6px 0 #a78bfa,0 0 0 0 #f9731688}50%{box-shadow:0 6px 0 #a78bfa,0 0 0 10px #f9731600}}
.tag{position:absolute;top:-8px;right:-4px;background:#f97316;color:#fff;font-size:13px;border-radius:10px;padding:2px 8px;font-weight:800}
.maphead{display:flex;align-items:center;gap:12px;text-align:left}
.maphead .mh{width:90px;flex:none}
/* scenes */
.scene{position:relative;height:340px;border-radius:24px;overflow:hidden;box-shadow:0 6px 0 #0000001a}
.scenetitle{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fffd;border-radius:999px;padding:4px 14px;font-weight:900;white-space:nowrap;font-size:17px;z-index:4;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.prop{position:absolute;font-size:38px;cursor:pointer;z-index:5;filter:drop-shadow(0 3px 2px #0003);line-height:1;padding:4px}
.prop.star{filter:grayscale(1) opacity(.55)}
.prop.star.lit{filter:drop-shadow(0 0 12px #fde047);animation:twinkle 1s ease-in-out infinite}
.prop.fruit{filter:grayscale(.8)}
.prop.fruit.awake{filter:drop-shadow(0 3px 2px #0003)}
.prop.dance{animation:dance2 .45s ease-in-out 4}
.prop.bloom{animation:pop .4s}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(15deg)}}
.wake{display:inline-block;background:#fef3c7;color:#92400e;border-radius:12px;padding:2px 10px;font-weight:900;font-size:14px;margin-left:6px}
.cast{position:absolute;bottom:4px;left:80px;right:6px;display:flex;justify-content:center;align-items:flex-end;gap:6px;z-index:3;pointer-events:none}
.castm{width:130px;transition:transform .2s}
.castm.side{width:100px}
.castm.bossm{width:120px;text-align:center;font-size:100px;line-height:1}
.castm.talk{transform:translateY(-8px) scale(1.06)}
.owlbox{position:absolute;left:6px;bottom:6px;width:84px;z-index:3;transition:transform .2s}
.owlbox.talk{transform:translateY(-8px) scale(1.08)}
.bubble{background:#fffdf5;border-radius:24px;padding:12px 18px;margin-top:12px;position:relative;border:4px solid #fbbf24;box-shadow:0 6px 0 #f59e0b55;cursor:pointer}
.bubble:before{content:"";position:absolute;top:-18px;left:40px;border:14px solid transparent;border-bottom:0;border-top:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:18px solid #fbbf24}
.who{font-weight:900;color:#7c3aed;font-size:18px}
.btext{font-size:24px;line-height:1.4;min-height:68px;font-weight:700;animation:slidein .35s both}
.brow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lineno{color:#94a3b8;font-weight:800}
.fx{position:fixed;pointer-events:none;font-size:30px;z-index:60;animation:fxfly 1.2s ease-out forwards}
@keyframes fxfly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
/* stage bar */
.stagebar{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.pill{background:#ffffffaa;border-radius:999px;padding:6px 14px;font-weight:800;font-size:17px;color:#64748b}
.pill.on{background:#fff;color:#7c3aed;box-shadow:0 3px 0 #a78bfa}
.pill.lv{background:#7c3aed;color:#fff}
/* blocks */
.gridwrap{display:flex;flex-direction:column;align-items:center;gap:3px;margin:10px 0;transition:transform .45s}
.grow{display:flex;align-items:center;gap:8px}
.blks{display:flex;gap:3px}
.blk{width:var(--s);height:var(--s);border-radius:calc(var(--s)/4);display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 #0002;animation:pop .35s both;cursor:pointer;font-size:calc(var(--s)*.62);line-height:1}
.blk i{font-style:normal}
.blk.tap{animation:tapb .3s}
.dancing .blk{animation:dance2 .5s ease-in-out 3}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes tapb{50%{transform:scale(1.35) rotate(10deg)}}
.sc{min-width:44px;font-weight:900;font-size:18px;background:#fef3c7;border-radius:10px;padding:2px 6px;color:#b45309;animation:pop .35s both}
.spin{transform:rotate(90deg) scale(.6)}
.skip{font-size:22px;font-weight:800;color:#7c3aed;min-height:30px}
.eq{font-size:26px;font-weight:900;margin:8px 0}
.eq.huge{font-size:36px;color:#16a34a}
.trickbox{text-align:left;max-width:520px;margin:10px auto}
.ex{background:#f5f3ff;border-radius:16px;padding:10px 16px;margin:8px 0}
.exh{font-weight:900;color:#7c3aed;font-size:20px}
.step{font-size:24px;font-weight:800;padding:4px 0;animation:slidein .4s both}
@keyframes slidein{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.fingers{display:flex;gap:6px;justify-content:center;align-items:flex-end;height:90px;margin:8px 0}
.finger{width:24px;height:80px;background:#c68642;border-radius:12px 12px 6px 6px;font-size:12px;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;color:#fff}
.finger.down{height:30px;background:#f87171}
.finger.gap{margin-left:16px}
.learnhead{display:flex;align-items:center;justify-content:center;gap:10px}
.minihero{width:80px;flex:none;position:relative}
/* questions */
.qcard{text-align:center}
.lead{font-size:20px;color:#7c3aed;font-weight:800}
.qtext{font-size:46px;font-weight:900;margin:8px 0}
.qtext.story{font-size:24px;line-height:1.4;font-weight:800}
.storypic{font-size:24px;line-height:1.3;margin:6px 0}
.storypic .grp{display:inline-block;background:#fef3c7;border-radius:12px;padding:2px 6px;margin:3px}
.ansbox{display:inline-block;min-width:140px;font-size:46px;font-weight:900;border:4px dashed #a78bfa;border-radius:18px;padding:4px 18px;color:#7c3aed;background:#faf5ff}
.ansbox.ok{border-color:#22c55e;color:#16a34a;background:#dcfce7;border-style:solid}
.ansbox.no{border-color:#ef4444;color:#dc2626;background:#fee2e2;border-style:solid}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:14px auto 0}
.pad button{font:inherit;font-size:30px;font-weight:900;height:62px;border:none;border-radius:16px;background:#ede9fe;color:#4c1d95;box-shadow:0 4px 0 #c4b5fd;cursor:pointer}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #c4b5fd}
.pad .ok{background:#22c55e;color:#fff;box-shadow:0 4px 0 #15803d}
.pad .del{background:#fde68a;box-shadow:0 4px 0 #f59e0b}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:460px;margin:12px auto}
.opt{font:inherit;font-size:34px;font-weight:900;min-height:76px;border:none;border-radius:18px;background:#e0f2fe;color:#075985;box-shadow:0 5px 0 #7dd3fc;cursor:pointer}
.opt:active{transform:translateY(3px)}
.arrs{grid-template-columns:repeat(3,1fr);max-width:600px}
.arrs .opt{display:flex;align-items:center;justify-content:center;padding:8px;min-height:130px;background:#fff7ed;box-shadow:0 5px 0 #fdba74}
.arrs .gridwrap{margin:0;gap:2px}.arrs .blks{gap:2px}.arrs .blk{animation:none;box-shadow:none}
.opt.right{background:#bbf7d0!important;box-shadow:0 5px 0 #22c55e!important}
.opt.wrong{background:#fecaca!important;box-shadow:0 5px 0 #ef4444!important}
.fb{font-size:24px;font-weight:900;min-height:34px;margin-top:10px;text-align:center}
.fb.good{color:#16a34a}.fb.bad{color:#dc2626}
.hint{background:#fffbeb;border:3px dashed #fbbf24;border-radius:18px;padding:10px;margin-top:12px;text-align:center;font-size:20px;font-weight:700}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0}
.dot{width:16px;height:16px;border-radius:50%;background:#e2e8f0}.dot.g{background:#22c55e}.dot.r{background:#f87171}.dot.c{background:#a78bfa}
/* boss */
.bossrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bossside{flex:1;text-align:center}
.bossE{font-size:96px;line-height:1;display:inline-block}
.bossE svg{width:120px;height:120px}
.bossE.hit{animation:hit .5s}
@keyframes hit{0%{transform:none;filter:none}20%{transform:translateX(-14px) rotate(-12deg) scale(.9);filter:brightness(2) saturate(0)}50%{transform:translateX(12px) rotate(10deg)}100%{transform:none}}
.bname{font-weight:900;font-size:19px}
.hpbar{height:22px;background:#fee2e2;border-radius:12px;overflow:hidden;border:3px solid #1e1b4b;max-width:300px;margin:6px auto}
.hpfill{height:100%;background:linear-gradient(90deg,#ef4444,#f97316);transition:width .4s}
.player{text-align:center;width:150px;position:relative;flex:none}
.player .pv{width:110px;margin:0 auto;position:relative}
.pname{font-weight:900;font-size:18px}
.hearts{font-size:30px;letter-spacing:2px}
.shield{position:absolute;left:-14px;right:-14px;top:-10px;bottom:-10px;border-radius:50%;border:5px solid #facc15;background:radial-gradient(#fde04766,#fde04700 70%);animation:shieldA 1.2s forwards;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:40px}
@keyframes shieldA{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.05);opacity:1}80%{opacity:1}100%{opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pow{position:absolute;font-size:60px;animation:powa .8s forwards;pointer-events:none}
@keyframes powa{from{transform:scale(.3);opacity:1}to{transform:scale(1.6) translateY(-40px);opacity:0}}
.starsbig{font-size:70px;color:#f59e0b;letter-spacing:6px}
.starsbig span{display:inline-block;animation:pop .5s both}
.starsbig .off{color:#cbd5e1}
.winheroes{display:flex;justify-content:center;align-items:flex-end;gap:10px}
.winheroes .w1{width:150px}.winheroes .w2{width:105px}
.reward{display:inline-block;background:#fef9c3;border:3px solid #facc15;border-radius:18px;padding:8px 16px;font-size:22px;font-weight:900;margin:6px}
/* closet */
.closethero{width:200px;margin:0 auto;cursor:pointer}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.item{font:inherit;border:none;background:#fff;border-radius:20px;padding:10px;cursor:pointer;box-shadow:0 5px 0 #c4b5fd;color:#1e1b4b}
.item .ie{font-size:42px}.item .in{font-weight:800;font-size:15px}.item .is{font-size:12px;color:#64748b;font-weight:700}
.item.on{background:#dcfce7;box-shadow:0 5px 0 #22c55e}
.item.locked{background:#e2e8f0;box-shadow:0 5px 0 #94a3b8;cursor:not-allowed}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:560px){h1{font-size:32px}.qtext{font-size:38px}.bossE{font-size:72px}.bossE svg{width:90px;height:90px}.bigemoji{font-size:64px}.arrs .opt{min-height:100px}.btn{font-size:20px}
 .scene{height:300px}.castm{width:100px}.castm.side{width:74px}.castm.bossm{width:86px;font-size:72px}.owlbox{width:62px}.cast{left:60px}.btext{font-size:21px}.prop{font-size:32px}
 .player{width:110px}.player .pv{width:84px}.hearts{font-size:24px}#top .title{font-size:16px}.iconbtn{width:40px;height:40px;font-size:19px}}

/* ---- v3: Sage + three heroes ---- */
body.theme-sage{background:linear-gradient(160deg,#fdf2f8 0%,#fbcfe8 42%,#fecdd3 75%,#fef3c7 100%);background-attachment:fixed}
.herocards{grid-template-columns:repeat(2,1fr);max-width:760px;margin:0 auto}
.herocard.sage{background:linear-gradient(#fdf2f8,#fce7f3);box-shadow:0 7px 0 #ec4899}
.herocard .hsv{width:min(170px,100%)}
svg.hero.sing{animation:sing .55s ease-in-out 3}
@keyframes sing{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-7deg) translateY(-8px) scale(1.04)}75%{transform:rotate(7deg) translateY(-8px) scale(1.04)}}
.castm.side2{width:92px}
.castm{min-width:0;flex-shrink:1}
.winheroes .w3{width:105px}
@media (max-width:560px){
 .herocards{grid-template-columns:1fr;gap:12px}
 .herocard{display:grid;grid-template-columns:88px 1fr;grid-template-rows:auto auto auto auto;column-gap:12px;text-align:left;align-items:center;padding:10px 14px}
 .herocard .hsv{grid-row:1/span 4;width:88px}
 .herocard .hn{font-size:22px}.herocard .ht{font-size:15px}.herocard .hl{font-size:13px;margin-top:2px}
 .castm.side2{width:66px}.winheroes .w1{width:120px}.winheroes .w2,.winheroes .w3{width:84px}
}

/* ---- v4: Eshon + signature colors (Emi purple, Sage pink, Blú blue, Eshon green) ---- */
body.theme-eshon{background:linear-gradient(160deg,#f0fdf4 0%,#bbf7d0 42%,#d9f99d 75%,#fef9c3 100%);background-attachment:fixed}
.herocard.emi{background:linear-gradient(#f5f3ff,#ede9fe);box-shadow:0 7px 0 #8b5cf6}
.herocard.blu{background:linear-gradient(#eff6ff,#dbeafe);box-shadow:0 7px 0 #3b82f6}
.herocard.eshon{background:linear-gradient(#f0fdf4,#dcfce7);box-shadow:0 7px 0 #22c55e}
.herocard.emi .ht{color:#6d28d9}.herocard.sage .ht{color:#be185d}.herocard.blu .ht{color:#1d4ed8}.herocard.eshon .ht{color:#15803d}
@media (min-width:561px){.herocard .hsv{width:min(150px,100%)}}
body.theme-emi{--hc:#8b5cf6;--hc2:#6d28d9;--hcl:#f5f3ff}
body.theme-sage{--hc:#ec4899;--hc2:#be185d;--hcl:#fdf2f8}
body.theme-blu{--hc:#3b82f6;--hc2:#1d4ed8;--hcl:#eff6ff}
body.theme-eshon{--hc:#16a34a;--hc2:#166534;--hcl:#f0fdf4}
body[class*=theme-] #top{background:var(--hcl);border-bottom:4px solid var(--hc)}
body[class*=theme-] #top .title{color:var(--hc2)}
body[class*=theme-] h2{color:var(--hc2)}
body[class*=theme-] .btn.pink,body[class*=theme-] .btn.purple,body[class*=theme-] .btn.blue,body[class*=theme-] .btn.green{background:var(--hc);box-shadow:0 5px 0 var(--hc2);color:#fff}
body[class*=theme-] .bubble{border-color:var(--hc)}
.bubble .btext,.scenetitle{color:#1e293b}
body[class*=theme-] .lvl{box-shadow:0 6px 0 var(--hc)}
body[class*=theme-] .tag{background:var(--hc2)}
body[class*=theme-] .item{box-shadow:0 5px 0 var(--hc)}

.lvbadge{width:132px;height:146px;margin:6px auto;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column}
.lvbadge svg{position:absolute;inset:0;width:100%;height:100%}
.lvbadge b,.lvbadge small{position:relative;font-family:var(--tfont);color:var(--deep);line-height:1}
.lvbadge small{font-size:16px;font-weight:800;margin-top:14px}.lvbadge b{font-size:52px;font-weight:800}
.xpbar,.pbar{height:16px;border-radius:999px;background:#E2E8F0;overflow:hidden;box-shadow:inset 0 2px 3px #0002}
.xpbar i,.pbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#F59E0B,#FFD166)}
.prow{display:grid;grid-template-columns:40px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid #E2E8F0}
.prow:last-child{border-bottom:none}
.prow .po{grid-row:1/3;width:40px;height:40px;border-radius:50%;color:#fff;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;font-family:var(--tfont)}
.prow .pn{font-weight:800;color:var(--ink)}.prow .pv{font-weight:800;color:#334155;font-size:15px;text-align:right}
.prow .pbar{grid-column:2/4}
.prow .ph{grid-column:2/4;font-size:14px;color:#475569}
.pstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:10px 0}
.pstat div{background:#fff;border-radius:16px;padding:8px;border:2px solid #E2E8F0}
.pstat b{display:block;font-family:var(--tfont);font-size:26px;color:var(--royal)}.pstat span{font-size:13px;color:#475569;font-weight:600}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #E2E8F0}
.setrow:last-child{border-bottom:none}
.setrow label,.setrow .sl{font-weight:700;color:var(--ink)}
.setrow small{display:block;font-weight:500;color:#475569}
.tog{position:relative;width:64px;height:36px;flex:none;border-radius:999px;border:none;background:#CBD5E1;cursor:pointer;padding:0;box-shadow:inset 0 2px 4px #0003}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0004;transition:left .15s}
.tog[aria-checked=true]{background:#10B981}.tog[aria-checked=true]::after{left:32px}
.tog{min-height:44px;height:44px;width:72px}.tog::after{top:6px;left:6px;width:32px;height:32px}.tog[aria-checked=true]::after{left:34px}
.verlab{color:#64748B;font-size:13px;text-align:center;margin-top:8px}
.qp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

body.bigtext #app{zoom:1.15}

function padClear(){const cv=$('pad-c');if(!cv)return;cv.getContext('2d').clearRect(0,0,cv.width,cv.height);PAD.img=null;try{localStorage.removeItem(PKEY);}catch(e){}SFX.chime();}
function initPad(){const cv=$('pad-c');if(!cv||!cv.getContext)return;const g=cv.getContext('2d');if(!g)return;
 let src=PAD.img;if(!src){try{src=localStorage.getItem(PKEY);}catch(e){}}
 if(src){const im=new Image();im.onload=()=>{try{g.drawImage(im,0,0);}catch(e){}};im.src=src;PAD.img=src;}
 let down=false,last=null,cnt=0;
 const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
 const dot=(p)=>{g.fillStyle=PAD.col;g.beginPath();g.arc(p[0],p[1],5,0,Math.PI*2);g.fill();};
 cv.addEventListener('pointerdown',e=>{e.preventDefault();down=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}last=pos(e);dot(last);});
 cv.addEventListener('pointermove',e=>{if(!down)return;e.preventDefault();const p=pos(e);g.strokeStyle=PAD.col;g.lineWidth=10;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(last[0],last[1]);g.lineTo(p[0],p[1]);g.stroke();last=p;if(++cnt%6===0)SFX.scribble(cnt);});

 cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',up);}

/* ---------- session (fresh random content per attempt) ---------- */
let S=null;
function makeSession(n,prev){
 const h=P().hist[n]||{};
 const learnK=pick([3,4,5,6,7].filter(x=>x!==h.learnK&&x!==n))||4;
 const flipK=pick([2,3,4,5,6].filter(x=>x!==learnK&&x!==h.flipK&&x!==n))||3;
 let trickKs;
 if(n===11)trickKs=[pick(range(2,9).filter(x=>!(h.trickKs||[]).includes(x))),pick(range(10,12).filter(x=>!(h.trickKs||[]).includes(x)))];
 else{const hi=n===9?10:12;trickKs=shuffle(range(2,hi).filter(x=>!(h.trickKs||[]).includes(x)&&x!==learnK)).slice(0,2);}
 const pool=HCTX[save.hero].concat(CTX);const ctxs=shuffle(pool.filter(c=>!(h.ctx||[]).includes(c.e))).concat(shuffle(pool));
 const hp=bossHP(n),nq=hp+HEARTS-1;
 const last=(h.bossKs||[]).slice(0,hp);
 const fresh=shuffle(range(1,12).filter(x=>!last.includes(x))),old=shuffle(range(1,12).filter(x=>last.includes(x)));
 let base=fresh.concat(old).slice(0,Math.min(hp,12));let bossKs=shuffle(base);while(bossKs.length<nq)bossKs.push(rand(2,12));
 const bt=['fill','mc','array','missing','story','fill','mc','story','fill','missing','mc','array'];
 const bTypes=shuffle(bt.slice(0,hp)).concat(shuffle(['fill','mc','missing','story'])).slice(0,nq);
 const tables=ORDER.filter(x=>x!==1);
 const boss=bossKs.map((k,i)=>makeQ(bTypes[i],(n===12&&i%2===1)?pick(tables):n,k,ctxs[i%ctxs.length]));
 const pKs=shuffle(range(2,12).filter(x=>x!==learnK)).slice(0,5);
 const pTypes=shuffle(['fill','mc','story','array','missing']);
 const practice=pKs.map((k,i)=>makeQ(pTypes[i],n,k,ctxs[(i+nq)%ctxs.length]));
 P().hist[n]={learnK,flipK,trickKs,bossKs,ctx:ctxs.slice(0,6).map(c=>c.e)};persist();
 return {n,learnK,flipK,trickKs,boss,practice,attempt:(prev&&prev.n===n?prev.attempt+1:1)};
}
function makeQ(type,n,k,ctx){
 const flip=Math.random()<.5,a=flip?k:n,b=flip?n:k,p=n*k;const q={type,n,k,a,b,p,ctx};
 if(type==='fill'){q.text=`${a} × ${b} = ?`;q.ans=p;q.input='pad';}
 else if(type==='mc'){q.text=`${a} × ${b} = ?`;q.ans=p;q.input='mc';q.lead='Tap the right answer!';const c=shuffle([p+n,p-n,p+1,p-1,p+k,p-k,p+10,p+2,p-2]).filter((v,i,ar)=>v>0&&v!==p&&ar.indexOf(v)===i).slice(0,3);q.opts=shuffle([p].concat(c));}
 else if(type==='missing'){q.text=Math.random()<.5?`${n} × ? = ${p}`:`? × ${n} = ${p}`;q.ans=k;q.input='pad';q.lead='Find the missing number! 🔍';}
 else if(type==='story'){q.a=k;q.b=n;q.text=`${k===1?'There is 1 '+ctx.g1:'There are '+k+' '+ctx.gs}. Each ${ctx.g1} has ${n} ${n===1?ctx.one:ctx.many} ${ctx.e}. How many ${ctx.many} are there in all?`;q.ans=p;q.input='pad';q.lead='Story problem! 📖';}
 else if(type==='array'){q.text=`Which blocks show ${a} × ${b}?`;q.input='arr';q.lead='Rows × blocks in each row 🧱';
  const cand=shuffle([[a,b+1],[a+1,b],[a,b-1],[a-1,b],[a+1,b+1],[a-1,b+1],[a+1,b-1],[a+2,b]]).filter(([r,c])=>r>=1&&c>=1&&r<=12&&c<=12&&r*c!==a*b);
  const ds=[];cand.forEach(d=>{if(ds.length<2&&!ds.some(x=>x[0]===d[0]&&x[1]===d[1]))ds.push(d);});
  q.opts=shuffle([[a,b]].concat(ds));q.ans=q.opts.findIndex(x=>x[0]===a&&x[1]===b);}
 return q;}
function explain(q){if(q.type==='array')return `It's the one with ${q.a} rows of ${q.b} blocks.`;if(q.type==='missing')return `${q.n} × ${q.k} = ${q.p}, so the missing number is ${q.k}.`;return `${q.a} × ${q.b} = ${q.p}`;}

function qHTML(q){

 if(q.lead)h+=`<div class="lead">${q.lead}</div>`;
 h+=`<div class="qtext ${q.type==='story'?'story':''}">${q.text}</div>`;
 if(q.type==='story'&&q.p<=36)h+=`<div class="storypic">${Array.from({length:q.k},()=>`<span class="grp">${q.ctx.e.repeat(q.n)}</span>`).join('')}</div>`;
 if(q.input==='pad')h+=`<div><span class="ansbox" id="ans">?</span></div><div class="pad" id="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button onclick="padPress('${d}')">${d}</button>`).join('')}<button class="del" onclick="padDel()" aria-label="Delete">⌫</button><button onclick="padPress('0')">0</button><button class="ok" id="okBtn" onclick="padOK()" aria-label="Check">✔</button></div>`;
 else if(q.input==='mc')h+=`<div class="opts" id="opts">${q.opts.map(v=>`<button class="opt" data-val="${v}" onclick="answer(${v},this)">${v}</button>`).join('')}</div>`;
 else h+=`<div class="opts arrs" id="opts">${q.opts.map((d,i)=>`<button class="opt" data-val="${i}" onclick="answer(${i},this)">${miniGrid(d[0],d[1])}</button>`).join('')}</div>`;

function padPress(d){if(!S||S.locked)return;if(inp.length>=3)return;if(inp==='0')inp='';inp+=d;SFX.tap();const a=$('ans');if(a)a.textContent=inp;}
function padDel(){if(!S||S.locked)return;inp=inp.slice(0,-1);SFX.tap();const a=$('ans');if(a)a.textContent=inp||'?';}

function answer(v,el){if(!S||S.locked||!S.onAnswer)return;const q=S.cur,ok=v===q.ans;

 S.onAnswer(ok);}

function subQ(a,b,kind,o){o=o||{};const d=a-b;const q=Qp(`${a} − ${b} = ?`,d,{m:{op:'sub',a,b},sig:`sub:${a}-${b}`,explain:`${a} − ${b} = ${d}`,lead:o.lead,vis:o.vis,hint:o.hint});
 if(kind==='a'||(kind==='b'&&Math.random()<.3))storySub(q,a,b);else if(o.mc!==false&&Math.random()<(kind==='b'?.3:.25))mcNum(q,[d+1,d-1,d+10,d-10,a+b,d+2]);return q;}
function storySub(q,a,b){const it=itm(),H=nm(save.hero),T=tN();const f=pick([0,1,2]);
 q.text=f===0?`${H} had ${cnt(a,it)} ${it.e}. ${H} gave ${b} to ${T}. How many ${it.many} does ${H} have left?`:f===1?`${H} has ${cnt(a,it)} ${it.e} and ${T} has ${cnt(b,it)}. How many more ${it.many} does ${H} have than ${T}?`:`There were ${cnt(a,it)} ${it.e}. The Muddle Monster's minion took ${b}! How many ${it.many} are left?`;
 q.lead=STORY;q.story=true;q.sig+=':s'+f;if(a<=12)q.vis=counters(a,it.e,f===1?0:b);}
function eqnQ(l,op,r,unk,kind){/* l op r = res, one of l/r/res unknown */const res=op==='+'?l+r:l-r;const show=[unk==='l'?'?':l,op==='+'?'+':'−',unk==='r'?'?':r,'=',unk==='res'?'?':res].join(' ');const ans=unk==='l'?l:unk==='r'?r:res;
 const q=Qp(show,ans,{m:{op:'eqn2',l:unk==='l'?null:l,o:op,r:unk==='r'?null:r,res},sig:`eq:${show}`,lead:'Find the missing number! 🔍',explain:`${l} ${op==='+'?'+':'−'} ${r} = ${res}, so the missing number is ${ans}.`,
  hint:unk==='l'&&op==='−'?`Think backwards: ${res} + ${r} = ?`:unk==='r'&&op==='−'?`Count up from ${res} to ${l}.`:`Use the fact family: ${res} − ${op==='+'&&unk==='l'?r:l} = ?`});
 if(kind==='a'){const it=itm(),H=nm(save.hero),T=tN();if(op==='−'&&unk==='l'){q.text=`${H} had some ${it.many} ${it.e}. After giving ${r} to ${T}, ${H} has ${res} left. How many did ${H} have at the start?`;}else if(op==='−'&&unk==='r'){q.text=`${H} had ${cnt(l,it)} ${it.e}. ${T} borrowed some. Now ${H} has ${res}. How many did ${T} borrow?`;}else{q.text=`${H} has ${cnt(op==='+'&&unk==='l'?r:l,it)} ${it.e}. How many more does ${H} need to have ${res}?`;}q.lead=STORY;q.sig+=':s';}return q;}

function divQ(n,d,kind,o){o=o||{};const qv=n/d;const q=Qp(`${n} ÷ ${d} = ?`,qv,{m:{op:'div',n,d},sig:`div:${n}/${d}`,explain:`${d} × ${qv} = ${n}, so ${n} ÷ ${d} = ${qv}`,lead:o.lead,vis:o.vis,hint:o.hint||`Skip count by ${d}s to ${n}: ${range(1,Math.min(qv,12)).map(i=>i*d).join(', ')}.`});
 if(kind==='a'||(kind==='b'&&Math.random()<.3))storyDiv(q,n,d);else if(o.mc!==false&&Math.random()<(kind==='b'?.3:.2))mcNum(q,[qv+1,qv-1,d,qv+2,n-d,qv*2]);return q;}
function teamList(k){const ids=teamIds();if(k<=ids.length){const a=ids.slice(0,k).map(nm);return a.slice(0,-1).join(', ')+' and '+a[a.length-1];}return `${k} friends`;}

 q.text=f===0?`${teamList(d)} share ${cnt(n,it)} ${it.e} fairly. How many ${it.many} does each one get?`:`${H} packs ${cnt(n,it)} ${it.e} into bags of ${d}. How many bags does ${H} fill?`;q.lead=STORY;q.story=true;q.sig+=':s'+f;if(n<=24)q.vis=counters(n,it.e);}
function remQ(n,d,kind,o){o=o||{};const Q=Math.floor(n/d),R=n%d;const q=Qqr(`${n} ÷ ${d} = ?`,Q,R,{m:{op:'divr',n,d},sig:`divr:${n}/${d}`,lead:o.lead||'Answer and remainder! 🧩',vis:o.vis,explain:`${d} × ${Q} = ${d*Q}, and ${n} − ${d*Q} = ${R} left over. So ${Q} R ${R}.`,hint:o.hint||`Biggest jump of ${d} that fits: ${d} × ${Q} = ${d*Q}. What's left?`});

 if(k==='a'){q.text=`${nm(save.hero)} baked a tray of ${d} muffins. ${tN()} ate ${n}. What fraction of the muffins did ${tN()} eat?`;q.lead=STORY;q.vis=fbar(n,d,{col:'#f59e0b'});q.sig+=':s';}return q;}

 {t:'Halves, Thirds & Fourths',e:'🍕',skill:'halves, thirds and fourths',place:{name:'Pizza Parlor',e:'🍕',desc:'Every pizza here must be cut into EQUAL slices.'},boss:['🐭','Nibbles the Crumb Mouse'],

/* column method: one row per multiplier digit (from the ones), carries above, placeholder zero, then add the rows */
function lmBuild(a,b){const A=digs(a),B=digs(b),ans=a*b,two=B.length>1,st=[],rows=[];
 B.forEach((m,r)=>{const tg='p'+r;
  if(r>0)st.push({ph:'Z',want:0,r,tgt:[tg+':0'],hi:['b:'+r],put:[[tg+':0','0']],
   ask:`0️⃣ <b>Placeholder zero:</b> now we multiply by the <b>${m}</b> in the tens place. What digit goes in the ones place of this row?`,
   tell:`We are multiplying by ${m} tens now, so we write a <b>0</b> in the ones place to hold it. That's the placeholder zero!`});
  let carry=0;
  A.forEach((d,i)=>{const p=d*m,v=p+carry,last=i===A.length-1,col=i+r;
   const hi=['a:'+i,'b:'+r];if(carry)hi.push(`c${r}:${col}`);
   const writes=last?String(v).split('').reverse().map((ch,j)=>[tg+':'+(col+j),ch]):[[tg+':'+col,String(v%10)]],tgt=writes.map(w=>w[0]);
   const wr=last?` Write <b>${v}</b> at the front of the row.`:v>=10?'':` Write <b>${v}</b> in the ${PLV[col]} place.`;
   st.push({ph:'M',want:p,r,d,m,hi,tgt,put:carry?[]:writes,ask:`✖️ <b>Multiply:</b> ${d} × ${m} = ?`,tell:`✖️ ${d} × ${m} = <b>${p}</b>.`+(carry?'':wr)});
   if(carry)st.push({ph:'A',want:v,r,p,carry,hi:[`c${r}:${col}`],tgt,put:writes,ask:`➕ <b>Add the carry:</b> ${p} + ${carry} = ?`,tell:`➕ Add the little carry: ${p} + ${carry} = <b>${v}</b>.`+wr});
   if(!last&&v>=10){const c=Math.floor(v/10);st.push({ph:'C',want:c,r,v,hi:[tgt[0]],tgt:[`c${r}:${col+1}`],put:[[tgt[0],String(v%10)],[`c${r}:${col+1}`,String(c)]],
     ask:`✏️ ${v} is too big for one box! The <b>${v%10}</b> stays in the ${PLV[col]} place. <b>Carry:</b> what goes in the little box above the next column?`,tell:`✏️ Write the <b>${v%10}</b> and carry the <b>${c}</b> up to the ${PLV[col+1]} column.`});carry=c;}
   else carry=0;});
  rows.push(a*m*Math.pow(10,r));});
 if(two){const sd=String(ans).split('').reverse();st.push({ph:'S',want:ans,hi:['p0','p1'],tgt:sd.map((c,j)=>'s:'+j),put:sd.map((c,j)=>['s:'+j,c]),

 if(SS.attempt>1)lines=[L('owl',pick(RETRY_OWL)),L('hero',pick(RETRY_HERO[h])),Lt(tw(T),TEAM_SUB[sid][T][1]),replyLine(),L('owl',`New numbers and new stories this time! Let's learn ${ch.skill} again.`)];
 else lines=[L('owl',`Chapter ${SS.c}: the ${pl.name}! ${ch.place.desc}`),L('owl',ch.final?`The Muddle Monster himself is hiding here, mixing up all the ${sb.name.toLowerCase()} stories!`:`But the Muddle Monster scrambled ${ch.skill} here, and ${ch.boss[1]} is guarding the way!`),

 return {title:`${pl.e} ${pl.name}`,place:pl,lines,extras:sExtras(),endLabel:'Start the lesson 📚'};}

/* ---------- learn ---------- */
function sStageBar(stage){const st=[['learn','📚 Learn'],['practice','🎯 Practice'],['apply','🌍 Apply'],['boss','⚔️ Boss']];
 return `<div class="stagebar"><span class="pill lv" style="background:${SS.sb.col}">${SS.sb.e} Ch.${SS.c} · ${SS.ch.t}</span>${st.map(([k,l])=>`<span class="pill ${k===stage?'on':''}" data-stage="${k}">${l}</span>`).join('')}</div>`;}
function teamBubble(){const T=SS.team;return `<div class="tmsay"><b>${HSTYLE[T].tag} ${esc(nm(T))}:</b> “${esc(Lt(tw(T),TEAM_SUB[SS.sid][T][(SS.c+1)%2]).text)}”</div>`;}
function sLearnHead(){return `<div class="learnhead slh"><div class="minihero" id="mh">${heroSVG(save.hero)}</div><div class="minihero" id="mt">${heroSVG(SS.team)}</div><div class="slt"><h2>📚 ${SS.ch.e} ${SS.ch.t}</h2>${teamBubble()}</div></div>`;}
function sLearn(){SS.cur=null;if(SS.ch.ld)return sLearnLD();SS.li=0;
 show(`${sStageBar('learn')}<div class="card" id="learnCard">${sLearnHead()}<div id="lsteps" class="lsteps"></div><div id="ltip" class="tipbox hidden"></div>
 <div class="row"><button class="btn purple" id="showBtn" data-enter onclick="sLearnNext()">✨ Show me</button><button class="btn green hidden" id="nextbtn" data-enter onclick="sPracticeStart()">Start Practice 🎯</button></div></div>`);
 sLearnNext();}
function sLearnNext(){if(!SS)return;const st=SS.steps;
 if(SS.li<st.length){const s=st[SS.li];$('lsteps').insertAdjacentHTML('beforeend',`<div class="lstep" data-step="${SS.li}"><div class="lsn">${SS.li+1}</div><div class="lsb"><div class="lst">${s.t}</div>${s.v?`<div class="lsv">${s.v}</div>`:''}</div></div>`);
  speak(stripH(s.t),'owl');SS.li++;SFX.tap();if(SS.li>=st.length)$('showBtn').textContent='💡 Show me the trick';const el=$('lsteps').lastElementChild;if(el&&el.scrollIntoView&&SS.li>1)el.scrollIntoView({behavior:'smooth',block:'nearest'});}
 else{const t=$('ltip');t.innerHTML=`<b>💡 Easy trick:</b> ${SS.ch.tip}`;t.classList.remove('hidden');speak('Easy trick! '+stripH(SS.ch.tip),'owl');SFX.good();$('showBtn').classList.add('hidden');$('nextbtn').classList.remove('hidden');if(t.scrollIntoView)t.scrollIntoView({behavior:'smooth',block:'nearest'});}}
function ldSeq(L){const q=[];L.steps.forEach((s,k)=>{q.push([k,'D'],[k,'M'],[k,'S']);if(s.bring!=null)q.push([k,'B']);});return q;}
function ldAfter(L,seq,i){return i+1<seq.length?{k:seq[i+1][0],ph:seq[i+1][1]}:{k:L.steps.length,ph:'end'};}
function ldSay(L,k,ph){const s=L.steps[k],d=L.d;
 if(ph==='D')return (k===0&&String(s.cur).length>1&&L.dg[0]<d?`${d} can't go into ${L.dg[0]}, so we look at ${s.cur}. `:'')+`Divide: how many ${d}s fit in ${s.cur}? ${s.q}! Write ${s.q} on top.`;
 if(ph==='M')return `Multiply: ${s.q} × ${d} = ${s.m}. Write ${s.m} under ${s.cur}.`;
 if(ph==='S')return `Subtract: ${s.cur} − ${s.m} = ${s.r}.`+(s.r>=d?' Too big! Check the divide step.':'');
 return `Bring down the next digit, ${s.bring}. Now we have ${s.r*10+s.bring}.`;}
function ldDone(L){return `No more digits to bring down! ${L.n} ÷ ${L.d} = <b>${L.Q}${L.R?' R '+L.R:''}</b>`+(L.R?` (${L.R} left over).`:'.');}
function sLearnLD(){const L=SS.L;SS.ldi=-1;SS.ldseq=ldSeq(L);
 show(`${sStageBar('learn')}<div class="card" id="learnCard">${sLearnHead()}
 <div class="lstep"><div class="lsb"><div class="lst">Let's solve <b>${L.n} ÷ ${L.d}</b> with long division. Every round has 4 steps: <b>Divide, Multiply, Subtract, Bring down</b>. Then repeat!</div></div></div>
 <div id="ldmsb">${dmsbBar('')}</div><div id="ldbox">${ldHTML(L,{k:0,ph:'D'},{k:0,ph:'D'})}</div><div class="ldsay" id="ldsay">Tap “Show me” to do one step at a time.</div><div id="ltip" class="tipbox hidden"></div>
 <div class="row"><button class="btn purple" id="showBtn" data-enter onclick="sLearnLDNext()">✨ Show me</button><button class="btn green hidden" id="nextbtn" data-enter onclick="sPracticeStart()">Start Practice 🎯</button></div></div>`);
 speak(`Let's solve ${L.n} divided by ${L.d} with long division. Divide, multiply, subtract, bring down!`,'owl');}
function sLearnLDNext(){if(!SS)return;const L=SS.L,seq=SS.ldseq;SS.ldi++;SFX.tap();
 if(SS.ldi<seq.length){const [k,ph]=seq[SS.ldi];$('ldbox').innerHTML=ldHTML(L,ldAfter(L,seq,SS.ldi),{k,ph});$('ldmsb').innerHTML=dmsbBar(ph);const t=ldSay(L,k,ph);$('ldsay').innerHTML=t;speak(stripH(t),'owl');}
 else if(SS.ldi===seq.length){$('ldbox').innerHTML=ldHTML(L,{k:L.steps.length,ph:'end'},null);$('ldmsb').innerHTML=dmsbBar('');const t=ldDone(L);$('ldsay').innerHTML=t;speak(stripH(t),'owl');$('showBtn').textContent='💡 Show me the trick';}
 else{const t=$('ltip');t.innerHTML=`<b>💡 Easy trick:</b> ${SS.ch.tip}`;t.classList.remove('hidden');speak('Easy trick! '+stripH(SS.ch.tip),'owl');SFX.good();$('showBtn').classList.add('hidden');$('nextbtn').classList.remove('hidden');}}
/* ---------- questions & inputs ---------- */
function sPadHTML(){return `<div class="pad spad" id="spad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-k="${d}" onclick="sPad('${d}')">${d}</button>`).join('')}<button class="del" data-k="del" onclick="sDel()">⌫</button><button data-k="0" onclick="sPad('0')">0</button><button class="ok" id="sok" data-k="ok" onclick="sOK()">✔</button></div>`;}
function sInputHTML(q){
 if(q.input==='mc')return `<div class="opts sopts ${q.opts.some(o=>/<svg|class="fbar/.test(o.h))?'pics':''}" id="sopts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}" onclick="sPick(${i},this)">${o.h}</button>`).join('')}</div>`;
 if(q.input==='ld')return `<div id="ldmsb">${dmsbBar('D')}</div><div id="ldbox"></div><div class="ldask" id="ldask"></div><div class="center"><div class="ansbox" id="sans">?</div></div><div class="center"><button class="btn blue sm hidden" id="bringBtn" onclick="sOK()">⬇️ Bring it down!</button></div>${sPadHTML()}`;
 if(q.input==='multi'){const b=i=>`<span class="fbox" id="f${i}" data-f="${i}" onclick="sFocus(${i})">?</span>`;let h;
  if(q.lay==='frac')h=`<div class="fstack">${b(0)}<span class="fbarline"></span>${b(1)}</div>`;
  else if(q.lay==='mix')h=`<div class="mixin">${b(0)}<div class="fstack">${b(1)}<span class="fbarline"></span>${b(2)}</div></div><div class="flab">whole · top · bottom</div>`;
  else h=`<div class="qrin">${b(0)}<b class="rlab">R</b>${b(1)}</div><div class="flab">answer · remainder</div>`;
  return `<div class="multi center" id="smulti">${h}</div>${sPadHTML()}`;}
 return `<div class="center"><div class="ansbox" id="sans">?</div></div>${sPadHTML()}`;}
function sQHTML(q){return `<div class="qcard sq ${q.story?'story':''}">${q.lead?`<div class="qlead">${q.lead}</div>`:''}<div class="${q.story?'qstory':'qeq'}">${q.text}</div>${q.vis?`<div class="qvis">${q.vis}</div>`:''}</div>${sInputHTML(q)}`;}
function sInpReset(q){SS.vals=Array(q.nf||1).fill('');SS.fi=0;SS.ldStep=0;SS.ldTry=0;SS.ldErr=0;}
function sRenderInp(){const q=SS.cur;if(!q)return;
 if(q.input==='multi'){for(let i=0;i<(q.nf||1);i++){const e=$('f'+i);if(e){e.textContent=SS.vals[i]===''?'?':SS.vals[i];e.classList.toggle('on',i===SS.fi&&!SS.locked);}}}
 else{const a=$('sans');if(a)a.textContent=SS.vals[0]===''?'?':SS.vals[0];}}
function sFocus(i){if(!SS||SS.locked)return;SS.fi=i;SFX.tap();sRenderInp();}
function sPad(d){if(!SS||!SS.cur||SS.locked||SS.cur.input==='mc')return;if(SS.cur.input==='ld'&&SS.ldPh==='B')return;const v=SS.vals[SS.fi];if(v.length>=5)return;SS.vals[SS.fi]=(v==='0'?'':v)+d;SFX.tap();sRenderInp();}
function sDel(){if(!SS||!SS.cur||SS.locked)return;const v=SS.vals[SS.fi];if(v===''&&SS.fi>0&&SS.cur.input==='multi')SS.fi--;else SS.vals[SS.fi]=v.slice(0,-1);SFX.tap();sRenderInp();}
function sOK(){if(!SS||!SS.cur||SS.locked)return;const q=SS.cur;
 if(q.input==='ld')return ldAnswer();
 if(SS.vals[SS.fi]===''){const e=$(q.input==='multi'?'f'+SS.fi:'sans');if(e){e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');}return;}
 if(q.input==='multi'){const nx=SS.vals.findIndex(v=>v==='');if(nx>=0){SS.fi=nx;SFX.tap();sRenderInp();return;}
  const v=SS.vals.map(x=>parseInt(x,10)),ok=!!q.check(v);SS.locked=true;sRenderInp();document.querySelectorAll('#smulti .fbox').forEach(e=>e.classList.add(ok?'ok':'no'));SS.onAnswer(ok);return;}
 const v=parseInt(SS.vals[0],10),ok=!!q.check(v);SS.locked=true;const a=$('sans');if(a)a.classList.add(ok?'ok':'no');SS.onAnswer(ok);}
function sPick(i,el){if(!SS||!SS.cur||SS.locked)return;const q=SS.cur,ok=!!q.check(i);SS.locked=true;el.classList.add(ok?'right':'wrong');if(!ok){const r=document.querySelector(`#sopts .opt[data-i="${q.ans}"]`);if(r)r.classList.add('right');}SS.onAnswer(ok);}
/* long division: the kid fills in each Divide / Multiply / Subtract / Bring-down step */
function ldInit(){const q=SS.cur,L=q.L;SS.ldseq=ldSeq(L);SS.ldStep=0;SS.ldTry=0;SS.ldErr=0;ldShow();}
function ldShow(){setTimeout(refreshLan,0);const q=SS.cur,L=q.L,seq=SS.ldseq,i=SS.ldStep;
 if(i>=seq.length){$('ldbox').innerHTML=ldHTML(L,{k:L.steps.length,ph:'end'},null);$('ldmsb').innerHTML=dmsbBar('');$('ldask').innerHTML=ldDone(L);$('sans').classList.add('hidden');$('bringBtn').classList.add('hidden');return;}
 const [k,ph]=seq[i],s=L.steps[k];SS.ldPh=ph;SS.vals=[''];
 $('ldbox').innerHTML=ldHTML(L,{k,ph},{k,ph});$('ldmsb').innerHTML=dmsbBar(ph);
 const ask=ph==='D'?`➗ <b>Divide:</b> how many times does ${L.d} go into <b>${s.cur}</b>?`:ph==='M'?`✖️ <b>Multiply:</b> ${s.q} × ${L.d} = ?`:ph==='S'?`➖ <b>Subtract:</b> ${s.cur} − ${s.m} = ?`:`⬇️ <b>Bring down</b> the next digit (${s.bring}).`;
 $('ldask').innerHTML=ask;$('sans').classList.toggle('hidden',ph==='B');$('bringBtn').classList.toggle('hidden',ph!=='B');$('sans').classList.remove('ok','no');sRenderInp();}
function ldAnswer(){const q=SS.cur,L=q.L,seq=SS.ldseq,[k,ph]=seq[SS.ldStep],s=L.steps[k];
 if(ph!=='B'&&SS.vals[0]==='')return;
 const want=ph==='D'?s.q:ph==='M'?s.m:ph==='S'?s.r:null,v=ph==='B'?null:parseInt(SS.vals[0],10);
 if(ph==='B'||v===want){SFX.good();SS.ldTry=0;if(ph!=='B')$('sans').classList.add('ok');SS.ldStep++;
  setTimeout(()=>{if(!SS||SS.cur!==q)return;ldShow();if(SS.ldStep>=seq.length){SS.locked=true;SS.onAnswer(true,SS.ldErr);}},ph==='B'?150:450);}
 else{SS.ldTry++;SS.ldErr++;SFX.bad();const a=$('sans');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake','no');
  if(SS.ldTry>=2){$('ldask').innerHTML+=`<div class="ldfix">It's <b>${want}</b>. ${ldSay(L,k,ph)}</div>`;SS.vals=[String(want)];sRenderInp();SS.ldTry=0;SS.ldStep++;setTimeout(()=>{if(!SS||SS.cur!==q)return;ldShow();if(SS.ldStep>=seq.length){SS.locked=true;SS.onAnswer(true,SS.ldErr);}},1800);}
  else{$('ldask').innerHTML=$('ldask').innerHTML.replace(/<div class="ldtry">.*<\/div>/,'')+`<div class="ldtry">Try again! ${ph==='D'?`Think: ${L.d} × ? is close to ${s.cur} without going over.`:ph==='M'?`Skip-count by ${L.d}, ${s.q} times.`:'Count back carefully.'}</div>`;setTimeout(()=>{if(!SS||SS.cur!==q)return;SS.vals=[''];a.classList.remove('no');sRenderInp();},700);}}}
/* ---------- practice + apply ---------- */
function sPracticeStart(){if(SS.lanP==null)SS.lanP=HINT_MAX.practice;SS.inBoss=false;SS.list=SS.practice.concat(SS.apply);SS.pi=0;SS.pScore=0;SS.pRes=[];sRenderQ();}
function sRenderQ(){const q=SS.list[SS.pi],isApply=SS.pi>=SS.practice.length;SS.cur=q;SS.locked=false;sInpReset(q);
 show(`${sStageBar(isApply?'apply':'practice')}<div class="card"><div class="row between"><div class="row"><div class="minihero" id="mh">${heroSVG(save.hero)}</div>${isApply?`<div class="minihero" id="mt">${heroSVG(SS.team)}</div>`:''}<h2>${isApply?`🌍 Apply it! ${SS.pi-SS.practice.length+1}/${SS.apply.length}`:`🎯 Practice ${SS.pi+1}/${SS.practice.length}`}</h2></div>
 ${lanHTML()}</div><div id="hintbox" class="hintbox hidden" aria-live="polite"></div>${dots(SS.pRes,SS.list.length)}
 ${sQHTML(q)}<div id="hint" class="hint hidden"></div><div id="fb" class="fb"></div><div class="row"><button id="nextbtn" class="btn green hidden" data-enter onclick="sPracticeNext()">Next ▶</button></div></div>`);
 if(q.input==='ld')ldInit();else sRenderInp();
 speak(stripH(q.text),'owl');
 SS.onAnswer=(ok,errs)=>{SS.locked=true;SS.pRes.push(ok);
  if(ok){SS.pScore++;heroRight('#mh');$('fb').className='fb good';$('fb').textContent='🎉 '+cheer()+(errs?' You finished every step!':'');if(isApply&&$('mt'))react('#mt','cheer');setTimeout(()=>{if(SS&&SS.cur===q)sPracticeNext();},q.input==='ld'?2200:1100);}
  else{SFX.bad();heroWrong('#mh');$('fb').className='fb bad';$('fb').innerHTML='Not quite! '+q.explain+' 💪';sHint(true);$('nextbtn').classList.remove('hidden');}};}
function sHint(full){if(!SS||!SS.cur)return;const h=$('hint');if(!h)return;h.innerHTML='💡 '+(SS.cur.hint||'Take it one step at a time!');h.classList.remove('hidden');if(!full)SFX.tap();}
function sPracticeNext(){if(!SS)return;if(SS.pi>=SS.list.length-1){sPracticeDone();return;}SS.pi++;sRenderQ();}
function sPracticeDone(){SS.locked=false;SS.cur=null;if(SS.quick)return quickDone(SS.sid,SS.pScore,SS.list.length);const ch=SS.ch,tot=SS.list.length;
 show(`${sStageBar('apply')}<div class="card center"><div class="winheroes"><div class="w1" id="mh">${heroSVG(save.hero,'cheer')}</div><div class="w2">${heroSVG(SS.team,'cheer')}</div></div><h2>Practice done!</h2><p class="big">You got <b>${SS.pScore} out of ${tot}</b>. ${SS.pScore>=tot-1?'You are ready!':'Good try! Remember the trick you learned!'}</p>
 <p class="big">But wait… something is coming… ${ch.final?'🌀':ch.boss[0]}</p><button class="btn" data-enter onclick="playScene(sMidScene(),sBossStart)">📖 Continue the story</button>
 <button class="btn gray sm" onclick="sLearn()">📚 Learn again</button></div>`);}
/* ---------- boss ---------- */
function sBossStart(){SS.lanB=HINT_MAX.boss;SS.inBoss=true;SS.hp=SS.max;SS.hearts=HEARTS;SS.bi=0;sRenderBoss();}
function sHeartStr(){return '❤️'.repeat(SS.hearts)+'🖤'.repeat(HEARTS-SS.hearts);}
function sRenderBoss(){const q=SS.boss[SS.bi%SS.boss.length],ch=SS.ch,max=SS.max;SS.cur=q;SS.locked=false;sInpReset(q);
 show(`${sStageBar('boss')}<div class="card" id="arena" style="position:relative"><div class="bossrow">
 <div class="bossside"><div id="bossE" class="bossE"><span class="bob">${ch.final?monsterSVG():ch.boss[0]}</span></div><div class="bname">${esc(ch.boss[1])}</div>
 <div class="hpbar"><div class="hpfill" id="hpfill" style="width:${SS.hp/max*100}%"></div></div><div style="font-weight:800" id="hptxt">${SS.hp}/${max} HP</div></div>
 <div class="player"><div class="pv" id="pv">${heroSVG(save.hero)}</div><div class="pname">${esc(nm(save.hero))}</div><div class="hearts" id="hearts">${sHeartStr()}</div></div></div></div>

 if(q.input==='ld')ldInit();else sRenderInp();speak(stripH(q.text),'owl');
 SS.onAnswer=ok=>{SS.locked=true;
  if(ok){SS.hp--;SFX.hit();heroRight('#pv');const b=$('bossE');b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');$('hpfill').style.width=(SS.hp/max*100)+'%';$('hptxt').textContent=`${SS.hp}/${max} HP`;

   $('fb').className='fb good';$('fb').textContent=`${H().power}! ${cheer()}`;setTimeout(()=>{if(!SS||SS.cur!==q)return;if(SS.hp<=0)sBossWin();else{SS.bi++;sRenderBoss();}},1000);}
  else{SS.hearts--;SFX.bad();heroWrong('#pv');$('hearts').textContent=sHeartStr();$('qbox').classList.add('shake');
   const sh=document.createElement('div');sh.className='shield';sh.textContent=HS().shield;$('pv').appendChild(sh);setTimeout(SFX.shield,200);
   const T=SS.team,enc=`${nm(T)}: ${ENC[T]||'"You can do it!"'}`;
   $('fb').className='fb bad';$('fb').innerHTML=`Ouch! ${q.explain}<div style="font-size:18px;color:#7c3aed">${esc(enc)}</div>`;setTimeout(()=>{if(!SS||SS.cur!==q)return;if(SS.hearts<=0)sBossLose();else{SS.bi++;sRenderBoss();}},2400);}};}
function sBossWin(){const stars=SS.hearts,o=SP(SS.sid),c=SS.c,prev=o.stars[c]||0;o.stars[c]=Math.max(prev,stars);let newR=null;
