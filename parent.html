   pl.days.forEach((v,i)=>{v=Math.max(0,Math.min(1440,+v||0));if(!v)return;const d=new Date(e);d.setDate(e.getDate()-(n-1-i));days[dk(d)]=v;});
   Object.entries(pl.months||{}).forEach(([k,v])=>{if(/^\d{4}-\d{2}$/.test(k)&&+v>0)months[k]=Math.min(44640,+v);});
   if(!Object.keys(days).length&&!Object.keys(months).length)src='none';}
  if(src==='none'&&ev&&ev.length){src='events';const old=dk(new Date(Date.now()-170*864e5));let prev=null;
   [...ev].sort((a,b)=>a.day<b.day?-1:1).forEach((e,i)=>{const m=Math.max(0,+e.minutes||0);
    const v=prev==null?(e.day<old?0:m):Math.max(0,m-prev);prev=m;if(v>0)days[String(e.day).slice(0,10)]=(days[String(e.day).slice(0,10)]||0)+v;});}
 }catch(e){}
 const any=Object.values(days).some(v=>v>0)||Object.values(months).some(v=>v>0);return {days,months,src:any?src:'none'};}
function fmtMin(m){m=Math.round(m||0);return m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':'');}
function playBuckets(pd,tab,now){now=now||new Date();const t=new Date(now);t.setHours(12,0,0,0);const out=[];const mk=(k)=>(pd.days[k]||0);
 const monthSum=(y,m)=>{const pre=y+'-'+p2(m+1);let s=pd.months[pre]||0;Object.entries(pd.days).forEach(([k,v])=>{if(k.slice(0,7)===pre)s+=v;});return s;};
 if(tab==='day'){for(let i=13;i>=0;i--){const d=new Date(t);d.setDate(t.getDate()-i);out.push({lab:i===0?'Today':String(d.getDate()),full:MON[d.getMonth()]+' '+d.getDate(),v:mk(dk(d))});}}
 else if(tab==='week'){const mon=new Date(t);mon.setDate(t.getDate()-((t.getDay()+6)%7));
  for(let w=11;w>=0;w--){const s=new Date(mon);s.setDate(mon.getDate()-7*w);let v=0;for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);v+=mk(dk(d));}
   out.push({lab:w===0?'Now':MON[s.getMonth()]+' '+s.getDate(),full:'Week of '+MON[s.getMonth()]+' '+s.getDate(),v});}}
 else if(tab==='month'){for(let i=11;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth()-i,1,12);out.push({lab:MON[d.getMonth()],full:MON[d.getMonth()]+' '+d.getFullYear(),v:monthSum(d.getFullYear(),d.getMonth())});}}
 else{const ys=new Set([t.getFullYear()]);Object.keys(pd.days).concat(Object.keys(pd.months)).forEach(k=>ys.add(+k.slice(0,4)));
  const lo=Math.max(Math.min(...ys),t.getFullYear()-5);for(let y=lo;y<=t.getFullYear();y++){let v=0;for(let m=0;m<12;m++)v+=monthSum(y,m);out.push({lab:String(y),full:String(y),v});}}
 return out;}

function playSVG(b,tab){const ph=window.matchMedia&&matchMedia('(max-width:520px)').matches,W=ph?340:600,H=ph?200:230,L=ph?44:48,R=ph?20:12,T=18,B=36,n=b.length,mx=Math.max(...b.map(x=>x.v)),top=mx<=10?10:mx<=30?30:mx<=60?60:mx<=600?Math.ceil(mx/120)*120:Math.ceil(mx/1200)*1200;
 const cw=(W-L-R)/n,bw=Math.min(46,cw*.62),y=v=>T+(H-T-B)*(1-v/top),every=ph?(tab==='week'?3:n>6?2:1):(n>12?2:1);
 const grid=[0,top/2,top].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#e2e8f0"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" font-size="12" text-anchor="end" fill="#64748b">${v>=60&&v%60===0?(v/60)+'h':Math.round(v)+'m'}</text>`).join('');
 const bars=b.map((x,i)=>{const cx=L+cw*(i+.5),h=Math.max(x.v>0?3:0,(H-T-B)*x.v/top),last=i===n-1;
  return `<rect class="ptbar" data-min="${x.v}" x="${(cx-bw/2).toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="5" fill="${last?'#f97316':'#fdba74'}"><title>${esc(x.full)}: ${fmtMin(x.v)}</title></rect>`+
  ((i%every===(n-1)%every)?`<text x="${cx.toFixed(1)}" y="${H-B+18}" font-size="12" text-anchor="middle" fill="${last?'#c2410c':'#64748b'}"${last?' font-weight="700"':''}>${esc(x.lab)}</text>`:'');}).join('');

function isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const y=d.getUTCFullYear(),w=Math.ceil(((d-Date.UTC(y,0,1))/864e5+1)/7);return y+'-W'+p2(w);}

 S.delNote='Checking the code…';draw();const {error}=await sb.auth.verifyOtp({email:S.user.email,token:c,type:'email'});
 if(error){S.delNote='That code did not work. Check the newest email and try again.';return draw();}
 S.delReauth=false;S.delOk=true;return delAccount();}
async function delAccount(){const v=S.delOk?'DELETE':(($('delConfirm')||{}).value||'').trim();S.delOk=false;
 if(v!=='DELETE'){S.delNote='Type DELETE (in capital letters) to confirm.';return draw();}
 S.delBusy=true;S.delNote='Deleting your account…';draw();let r;
 try{const {data,error}=await sb.functions.invoke('nr-delete-account',{body:{confirm:'DELETE'}});
  if(error){let j=null;try{j=error.context&&typeof error.context.json==='function'?await error.context.json():null}catch(e){}r=j||{ok:false,error:'unreachable'};}else r=data;}catch(e){r={ok:false,error:'unreachable'};}
 S.delBusy=false;
 if(r&&r.error==='reauth'){const {error}=await sb.auth.signInWithOtp({email:S.user.email,options:{shouldCreateUser:false}});S.delReauth=!error;S.delNote=error?'We could not send a verification code. Please try again in a minute.':'For your safety, confirm it is you: we emailed a 6-digit code to '+S.user.email+'. Nothing has been deleted yet.';return draw();}
 if(r&&r.ok&&!r.verified)r={ok:false,error:'partial'};
 if(!r||!r.ok){S.delNote=r&&r.error==='partial'?'Some of your data was deleted but not all of it. Nothing is lost by trying again: tap Delete again. If it keeps failing, email us and we will finish it.':r&&r.error==='unreachable'?'Could not reach the server, so nothing was deleted. Check your connection and try again.':'Your account was not deleted. Please try again.';return draw();}
 window.__nrOut=1;try{await sb.auth.signOut({scope:'global'});}catch(e){}try{await sb.auth.signOut({scope:'local'});}catch(e){}
 try{Object.keys(localStorage).filter(k=>/^nr-pc|^nr-prefs|^sb-/.test(k)).forEach(k=>localStorage.removeItem(k));}catch(e){}
 TOUR.stop();Object.assign(S,{consented:false,welcome:false,user:null,step:'email',kids:[],view:'family',err:'',delNote:'',msg:'Your account and all its data were deleted. You are signed out.'});viewLogin();}

  ${tipsHTML(k,pr)}${questHTML(k,pr)}${fixitHTML(k,pr)}${rewardsHTML(k,pr)}${milestonesHTML(k,pr)}${challengeHTML(k,pr,ev)}

 render(`${S.welcome?welcomeHTML():''}${toastHTML()}<div class="card" id="familyCard"><h2>Your family</h2>${S.kids.length?`<div class="grid">${S.kids.map(k=>{const pr=S.progress[k.id],st=struggles(pr)[0];
   return `<button class="kid" type="button" data-kid="${k.id}"><b>${esc(k.nickname)}</b>${pr&&pr.hero?` <span class="small">plays ${esc(HERO[pr.hero]||pr.hero)}</span>`:''}<br>

  ${S.kids.length<2?'<button class="btn" id="addKidBtn" type="button">➕ Add a kid</button>':'<p class="small">This test allows up to 2 kids.</p>'}${errHTML()}</div>
  <div class="card" id="pcCard"><h2>🧭 Parent Center</h2><div class="lsgrid"><button type="button" class="lcard" id="openLessons"><span class="lci" aria-hidden="true">📚</span><b>Learn the method</b><span class="small">${LESSONS.length} two-minute lessons</span></button>

  <a class="lcard" id="openGameNight" href="gamenight.html${window.NR_FLAG?'?parenttest=1':''}" onclick="try{sessionStorage.setItem('nr-gn-ok','1')}catch(e){}" style="text-decoration:none;color:inherit"><span class="lci" aria-hidden="true">🎉</span><b>Family Game Night</b><span class="small">Host a math party on everyone's devices</span></a></div>${PC.p4===false?setupNote('Quests, fix-it plans and rewards'):''}</div>
  <div class="card" id="allDevices"><h2>Linked devices</h2>${S.devices.length?S.devices.map(devRow).join(''):'<p class="small">No devices yet. Open a kid and tap “Add a device”.</p>'}</div>${helpHTML()}${soonHTML()}`);}
function devRow(d){const k=S.kids.find(x=>x.id===d.kid_id)||{};return `<div class="dev"><span><b>${esc(d.device_name)}</b> <span class="small">· ${esc(k.nickname||'')} · last sync ${ago(d.last_seen_at)}</span></span><button class="btn red sm" type="button" data-unlink="${d.id}">Remove</button></div>`;}
let timer=null;function tick(){clearInterval(timer);const go=()=>{const el=$('countdown');if(!el||!S.code){clearInterval(timer);return;}const s=Math.max(0,Math.round((new Date(S.code.expires_at)-Date.now())/1000));
 el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s){el.textContent='expired';clearInterval(timer);}};go();timer=setInterval(go,1000);}

/* ---------- v28: sample data (example only, never saved) ---------- */
const SAMPLE_ID='sample-kid';

function sampleData(){const today=new Date(),iso=d=>d.toISOString().slice(0,10);
 const days=Array.from({length:400},(_,i)=>i%7===3||i%11===5?0:6+(i*37)%30);
 const ev=Array.from({length:7},(_,i)=>({kid_id:SAMPLE_ID,day:iso(new Date(today-(6-i)*864e5)),stars_total:20+i*3,answers_right:120+i*14,answers_total:150+i*17,minutes:60+i*18}));
 return {kid:{id:SAMPLE_ID,nickname:'Sample Kid',age_range:'6-8',grade:'2',created_at:iso(today),sample:true},
  progress:{kid_id:SAMPLE_ID,hero:'emi',updated_at:new Date(today-36e5).toISOString(),time_played_sec:5*3600+1200,lanterns_used:4,examples_opened:9,
   realms:{add:{stars:21,chapters:7,total:10,max:30},sub:{stars:12,chapters:4,total:10,max:30},mult:{stars:8,chapters:3,total:12,max:36},div:{stars:0,chapters:0,total:10,max:30},frac:{stars:2,chapters:1,total:8,max:24},mix:{stars:0,chapters:0,total:6,max:18}},
   skills:{'mult:x7':{n:'×7 facts',r:6,t:14,l:4},'add:c2':{n:'adding within 20',r:38,t:40,l:0},'sub:c3':{n:'subtracting across zero',r:9,t:15,l:2},'mult:x2':{n:'×2 facts',r:30,t:31,l:0},'frac:c3':{n:'halves, thirds and fourths',r:3,t:6,l:1}},
   play:{v:1,end:iso(today),days,months:{}}},events:ev};}
function sampleApply(){const d=sampleData();S.kids=[d.kid];S.progress={[SAMPLE_ID]:d.progress};S.events={[SAMPLE_ID]:d.events};S.devices=[];
 SUM[SAMPLE_ID]={state:'local',source:'template',text:'Sample Kid played about 2 hours on 5 days this week and earned 18 stars. Adding within 20 is rock solid (95% right). ×7 facts need a little love: try skip-counting by 7s on the stairs.'};}
function sampleOn(){if(S.sample)return;S._real={kids:S.kids,progress:S.progress,events:S.events,devices:S.devices};S.sample=true;sampleApply();}
function sampleOff(){if(!S.sample)return;S.sample=false;const r=S._real||{};S.kids=r.kids||[];S.progress=r.progress||{};S.events=r.events||{};S.devices=r.devices||[];delete SUM[SAMPLE_ID];if(S.kid===SAMPLE_ID){S.kid=null;}if(S.view==='kid'||S.view==='code')S.view='family';}

 if(SAMPLE_WRITE_IDS.includes(t.id)||SAMPLE_WRITE_DATA.some(k=>k in t.dataset)){const m=$('sampleMsg');if(m)m.textContent=' That button is turned off in the example. Add your own kid to use it.';else alert('That button is turned off in the example.');return true;}return false;}
app.addEventListener('click',ev=>{const t=ev.target.closest('button');if(t&&t.id==='sampleBtn'){sampleOn();draw();}});
/* ---------- v28: Help / FAQ ---------- */
const HELP=[['🔗 Linking a kid','Add a kid (a nickname is enough), open them and tap “Add a device”. Type the 6-letter code, or scan the QR code, in the game under Settings on the kid’s device. Progress syncs from then on.'],
 ['📊 Progress tabs','Time shows minutes played per day, week, month or year. Accuracy shows percent right. Realms shows stars per world. Skill map shows each skill as Mastered, Growing, Needs practice or Not tried yet.'],
 ['🗞️ Weekly summary','A short note about the week. It is labeled “AI-written” when AI wrote it, or “Written from your kid’s numbers”. The AI never gets your kid’s name.'],
 ['🎯 Tips & fix-it plans','Tips point at weak skills using your kid’s real numbers. A fix-it plan is 5 short days: one in-game quest plus a 2-minute activity at home.'],
 ['📜 Quest from home','Pick a skill and a number of questions. It shows up as a scroll on your kid’s linked device, and the result comes back here.'],

app.addEventListener('click',ev=>{const t=ev.target.closest('button');if(t&&t.id==='helpTour')TOUR.start();});
/* ---------- v28: first-visit guided tour ---------- */
const TOUR=(function(){
 const kid=()=>{const k=S.kids[0];if(!k)return false;S.view='kid';S.kid=k.id;S.etab=S.etab||'time';return true;};
 const etab=v=>()=>{if(!kid())return false;S.etab=v;return true;};
 const STEPS=[
  {go:()=>{S.view='family';return true;},sel:'#familyCard',t:'👋 Welcome to the Parent Area',x:'A quick tour of what you can do here. It takes about a minute. You can skip it and replay it any time with “❓ How it works”.'},
  {k:1,go:kid,sel:'#kidDevices',t:'🔗 Link your kid’s device',x:'Open a kid and tap “Add a device”. Type the code or scan the QR code in the game on their tablet or phone. Progress then shows up here.'},
  {k:1,go:etab('time'),sel:'#engWrap',t:'⏱ Time',x:'How long your kid plays, per day, week, month or year.'},
  {k:1,go:etab('acc'),sel:'#engWrap',t:'🎯 Accuracy',x:'The percent of answers right over time. Steady is great; dips are normal when a new skill starts.'},
  {k:1,go:etab('realms'),sel:'#engWrap',t:'🗺️ Realms',x:'Stars earned in each world of the game, from Addition Meadow to Muddle Tower.'},
  {k:1,go:etab('skills'),sel:'#engWrap',t:'🧩 Skill map',x:'Every skill as a tile: Mastered, Growing, Needs practice, Just started or Not tried yet.'},
  {k:1,go:kid,sel:'#summaryCard',t:'🗞️ Weekly summary',x:'A short note about the week: time, wins, weak spots and a tip. It says “AI-written” when AI wrote it. The AI never sees your kid’s name.'},
  {k:1,go:kid,sel:'#tipsCard',t:'💡 Tips',x:'Tips use your kid’s real numbers (like “gets ×7 right 6 of 14 times”) with a lesson, a quest or a fix-it plan one tap away.'},
  {k:1,go:kid,sel:'#fixitCard',t:'🛠️ Fix-it plans',x:'Five short days for one tricky skill: an in-game quest plus a 2-minute activity at home. You see accuracy before and after.'},
  {k:1,go:kid,sel:'#questCard',t:'📜 Quest from home',x:'Send a mini mission with an optional message. It appears as a scroll in the game on your kid’s device.'},
  {k:1,go:kid,sel:'#rewardsCard',t:'🎁 Rewards',x:'Promise a real-world reward for stars, minutes or quests. It is earned automatically and your kid sees the progress bar.'},
  {go:()=>{S.view='alerts';return true;},sel:'#prefsCard',t:'🔔 Alerts & quiet hours',x:'Pick which alerts you want, the daily play goal and quiet hours. Alerts only show on this page.'},
  {go:()=>{S.view='alerts';return true;},sel:'#emailPrefs',t:'✉️ Weekly email',x:'Off until you turn it on. Pick a day, and preview it right now. Every email has an unsubscribe link.'},
  {go:()=>{S.view='family';return true;},sel:'#openGameNight',t:'🎉 Family Game Night',x:'Math party on everyone’s devices: you open a room, the family joins with a code. Points for right and fast answers.'},
  {go:()=>{S.view='family';return true;},sel:'#openLessons',t:'📚 Learn the method',x:'Two-minute lessons that show how the game teaches, so you can help the same way at home.'},
  {go:()=>{S.view='family';return true;},sel:'#helpCard',t:'✅ That’s it!',x:'Questions later? The Help & FAQ is here, and “❓ How it works” at the top replays this tour.'}];
 let i=-1,tmp=false,els=null;
 const key=()=>'nr-tour-done:'+(S.user&&S.user.id);
 function done(){try{if(localStorage.getItem(key())==='1')return true;}catch(e){}return !!(S.user&&S.user.user_metadata&&S.user.user_metadata.nr_tour_done);}
 function markDone(){try{localStorage.setItem(key(),'1');}catch(e){}
  if(S.user&&!(S.user.user_metadata||{}).nr_tour_done){S.user.user_metadata=Object.assign({},S.user.user_metadata,{nr_tour_done:true});sb.auth.updateUser({data:{nr_tour_done:true}}).catch(()=>{});}}
 function maybe(){if(i<0&&S.user&&S.consented&&!done())start();}
 function ui(){if(els)return els;const shade=document.createElement('div');shade.id='tourShade';const hole=document.createElement('div');hole.id='tourHole';
  const pop=document.createElement('div');pop.id='tourPop';pop.setAttribute('role','dialog');pop.setAttribute('aria-modal','true');pop.setAttribute('aria-labelledby','tourT');
  document.body.append(shade,hole,pop);pop.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='tourNext')show(i+1);else if(b.id==='tourBack')show(i-1);else if(b.id==='tourSkip'||b.id==='tourDone')stop(true);});
  document.addEventListener('keydown',onKey);addEventListener('resize',place);addEventListener('scroll',place,{passive:true});return els={shade,hole,pop};}
 function onKey(e){if(i<0)return;if(e.key==='Escape')stop(true);else if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1);}
 function target(){return i>=0&&document.querySelector(STEPS[i].sel);}
 function place(){if(!els||i<0)return;const t=target(),h=els.hole;if(!t){h.style.cssText='left:50%;top:40%;width:0;height:0';return;}
  const r=t.getBoundingClientRect(),pad=6;h.style.left=(r.left-pad)+'px';h.style.top=(r.top-pad)+'px';h.style.width=(r.width+2*pad)+'px';h.style.height=(r.height+2*pad)+'px';}
 function show(n){if(n<0)return;if(n>=STEPS.length)return stop(true);
  if(!S.kids.length&&STEPS[n].k){sampleOn();tmp=true;}
  i=n;const st=STEPS[i];if(st.go()===false){}draw();ui();
  const t=target(),last=i===STEPS.length-1;
  els.pop.innerHTML=`<h3 id="tourT">${st.t}</h3><p id="tourX">${st.x}</p>${S.sample&&tmp?'<p class="small" id="tourSample">📋 Shown with example data until you link a kid.</p>':''}
   <div class="trow">${i?'<button class="btn gray sm" id="tourBack" type="button">← Back</button>':''}${last?'<button class="btn sm" id="tourDone" type="button">Got it!</button>':'<button class="btn blue sm" id="tourNext" type="button">Next →</button><button class="btn gray sm" id="tourSkip" type="button">Skip tour</button>'}<span class="tstep" id="tourStep">${i+1} / ${STEPS.length}</span></div>`;
  document.body.style.paddingBottom=(els.pop.offsetHeight+40)+'px';
  if(t){const pop=els.pop.getBoundingClientRect();const r=t.getBoundingClientRect();const room=innerHeight-pop.height-24;
   let y=scrollY+r.top-Math.max(12,Math.min(80,(room-r.height)/2));window.scrollTo(0,Math.max(0,y));}
  place();requestAnimationFrame(place);const b=document.getElementById(last?'tourDone':'tourNext');b&&b.focus({preventScroll:true});}
 function start(){i=-1;show(0);}
 function stop(finished){if(i<0&&!els)return;i=-1;if(els){els.shade.remove();els.hole.remove();els.pop.remove();document.body.style.paddingBottom='';document.removeEventListener('keydown',onKey);removeEventListener('resize',place);removeEventListener('scroll',place);els=null;}
  if(finished)markDone();if(tmp){tmp=false;sampleOff();}S.view='family';if(S.user&&S.consented)draw();}
 $('tourBtn').onclick=()=>start();
 return {start,stop,maybe,done,STEPS,get i(){return i;}};})();
sb.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_IN'&&session&&!S.user){S.user=session.user;boot();}
 /* v32 PC-14: sign-out in another tab or an expired session clears this page too */
 else if(ev==='SIGNED_OUT'&&S.user&&!window.__nrOut){S.user=null;try{SUM&&Object.keys(SUM).forEach(k=>delete SUM[k]);}catch(e){}location.replace(location.pathname+location.search);}
 else if(ev==='TOKEN_REFRESHED'&&session&&S.user)S.user=session.user;});
boot().catch(e=>{S.err=friendly(e);viewLogin();});
