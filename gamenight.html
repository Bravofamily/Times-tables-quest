<style>
@font-face{font-family:'Baloo 2';font-weight:600 800;font-display:swap;src:url(fonts/baloo2-latin-600-800.woff2) format('woff2')}

*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
body{font-family:Poppins,system-ui,sans-serif;color:#0f172a;background:linear-gradient(160deg,#0A1F44,#1E3A8A 60%,#7c3aed);min-height:100vh}
#testBanner{background:#fbbf24;color:#3b2300;text-align:center;font-weight:700;padding:8px 12px;font-size:14px}
header{max-width:900px;margin:0 auto;padding:16px 16px 4px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-family:'Baloo 2',Poppins,sans-serif;font-weight:800;font-size:26px;margin:0;line-height:1.1}header h1 span{color:#00C2FF}
.tag{color:#c7d2fe;font-size:13px;margin:0}
main{max-width:900px;margin:0 auto;padding:8px 16px 40px}
.card{background:#fff;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 6px 0 #0000001a,0 10px 30px #0000002a}

label{display:block;font-weight:700;margin:12px 0 4px}

.hero b{display:block;font-size:26px}.hero[aria-pressed=true]{border-color:#7c3aed;background:#ede9fe}

.board{list-style:none;padding:0;margin:8px 0}.board li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;margin:6px 0;background:#f1f5f9;font-weight:700}

.pod{text-align:center;width:31%;max-width:180px}.pod .blk{border-radius:14px 14px 0 0;color:#fff;font-family:'Baloo 2',Poppins,sans-serif;font-size:34px;font-weight:800;padding-top:8px}
.pod.p1 .blk{height:150px;background:#f59e0b}.pod.p2 .blk{height:110px;background:#94a3b8}.pod.p3 .blk{height:80px;background:#b45309}

<body>
<div id="testBanner" hidden>TEST MODE: Family Game Night preview</div>
<header><div class="nrbackrow"><a class="nrback" id="backLink" href="./" aria-label="Back to the NumiRealm game Home">🏠 Back to NumiRealm</a></div><div><h1>Numi<span>Realm</span> 🎉 Game Night</h1><p class="tag">Enter the Realm. Master the Math.</p></div></header>

<script>
/* NumiRealm Family Game Night (TEST). Supabase Realtime broadcast + presence, publishable key only.
   The host page is the source of truth: it makes the questions, keeps the answers and scores.
   Nothing is stored in a database: nicknames live only in the room while it is open. */
const GN=(function(){
'use strict';
const CFG={url:'https://uuigasrelqbwxopvqoib.supabase.co',key:'sb_publishable_0E3BTvmAlWAc9wxz1Rl55w_0K6J-bmr'};
const qs=new URLSearchParams(location.search);
const FLAG=(function(){try{var q=new URLSearchParams(location.search).get('parenttest');if(q==='1')localStorage.setItem('nr-parenttest','1');else if(q==='0'){localStorage.removeItem('nr-parenttest');sessionStorage.removeItem('nr-parenttest');}return localStorage.getItem('nr-parenttest')==='1'||(q!=='0'&&sessionStorage.getItem('nr-parenttest')==='1');}catch(e){return new URLSearchParams(location.search).get('parenttest')==='1';}})(); // v29 remembered flag
const LINKED=(()=>{try{return !!localStorage.getItem('nr-parent-link');}catch(e){return false;}})();
const PORTAL=(()=>{try{return sessionStorage.getItem('nr-gn-ok')==='1';}catch(e){return false;}})();
const FQ=FLAG?'?parenttest=1':'';(function(){var a=document.getElementById('backLink');if(a)a.href='./'+FQ;})();
const MAX=8,GRACE=10000,REVEAL_MS=6000,ROOM_TTL=3*3600e3;
const HEROES=[['sage','Sage','🎤'],['emi','Emi','💜'],['blu','Blú','⭐'],['eshon','Eshon','✏️']];
const HERO=Object.fromEntries(HEROES.map(h=>[h[0],h]));
const TOPICS=[['mult','✖️ Times tables'],['add','➕ Adding'],['sub','➖ Taking away'],['div','➗ Sharing (division)'],['frac','🍕 Fractions']];
const LEVELS=[['a','Ages 4-7'],['b','Ages 8-10'],['c','Ages 11+'],['g','Grown-up']];
const LV=Object.fromEntries(LEVELS);
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const cleanName=s=>String(s||'').replace(/[^\p{L}\p{N} '\-]/gu,'').replace(/\s+/g,' ').trim().slice(0,12);
/* v32 (CR-02): ids and room codes come from crypto.getRandomValues, not Math.random. */
const rnd=n=>{const a=new Uint32Array(1),lim=Math.floor(0x100000000/n)*n;do{crypto.getRandomValues(a);}while(a[0]>=lim);return a[0]%n;};
const uid=()=>{const b=new Uint8Array(12);crypto.getRandomValues(b);return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');};
const CODE_CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const newCode=()=>Array.from({length:5},()=>CODE_CH[rnd(CODE_CH.length)]).join('');
const cleanCode=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
const now=()=>Date.now();

/* ---------- questions (all answers are whole numbers) ---------- */
function gen(topic,lv){let t,a;
 if(topic==='add'){const r={a:[[1,10],[1,10]],b:[[10,99],[1,50]],c:[[100,999],[10,999]],g:[[150,999],[150,999]]}[lv];const x=R(...r[0]),y=R(...r[1]);t=`${x} + ${y}`;a=x+y;}
 else if(topic==='sub'){const r={a:[[2,10]],b:[[20,99]],c:[[100,999]],g:[[300,1500]]}[lv][0];const x=R(...r),y=R(1,x-1);t=`${x} − ${y}`;a=x-y;}
 else if(topic==='mult'){const r={a:[[1,5],[1,5]],b:[[2,10],[2,10]],c:[[2,12],[2,12]],g:[[6,15],[6,15]]}[lv];const x=R(...r[0]),y=R(...r[1]);t=`${x} × ${y}`;a=x*y;}
 else if(topic==='div'){const r={a:[[1,5],[1,5]],b:[[2,10],[2,10]],c:[[2,12],[2,12]],g:[[6,15],[6,15]]}[lv];const x=R(...r[0]),y=R(...r[1]);t=`${x*y} ÷ ${x}`;a=y;}
 else{const f={a:[[1,2]],b:[[1,2],[1,4],[1,3]],c:[[3,4],[2,3],[2,5]],g:[[5,8],[3,8],[4,5],[5,6]]}[lv];const [n,d]=pick(f);const m=R(1,lv==='a'?10:12)*d;t=`${n}/${d} of ${m}`;a=m/d*n;}
 return {text:t,ans:a};}
function choicesFor(a){const s=new Set([a]);const off=[1,2,-1,-2,10,-10,3,5];let i=0;
 while(s.size<4&&i<40){const v=a+pick(off)*(i>20?R(1,3):1);if(v>=0)s.add(v);i++;}
 while(s.size<4)s.add(a+s.size*7);
 return [...s].sort(()=>Math.random()-.5);}

/* ---------- owl narrator (host screen only) ---------- */
function narratorOn(){try{const o=JSON.parse(localStorage.getItem('ttq-save-v2')||'null');if(o&&typeof o.narrator==='boolean')return o.narrator;}catch(e){}return true;}
let VOICE_ON=narratorOn();
function say(text){try{if(!VOICE_ON||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/−/g,' minus '));u.rate=1;speechSynthesis.speak(u);}catch(e){}}
function owl(text){return `<div class="owl" id="owlLine"><span class="o" aria-hidden="true">🦉</span><p>${esc(text)}</p></div>`;}

/* ---------- confetti ---------- */
function confetti(){const c=document.getElementById('confetti');if(!c||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,v:2+Math.random()*4,r:4+Math.random()*5,c:pick(['#f97316','#2563eb','#facc15','#db2777','#059669','#a78bfa'])}));
 let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin((p.y+n)/30);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6);});if(++n<240)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();}

/* ---------- realtime ---------- */
let sb=null;
function client(){if(sb)return sb;if(!window.supabase)return null;try{sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false}});}catch(e){sb=null;}return sb;}
function openChannel(code,key,on,onStatus){const c=client();if(!c){onStatus('NO_CLIENT');return null;}
 const ch=c.channel('nrgn-'+code,{config:{broadcast:{self:false},presence:{key}}});
 Object.entries(on.broadcast||{}).forEach(([ev,fn])=>ch.on('broadcast',{event:ev},m=>fn(m.payload||{})));
 if(on.presence)ch.on('presence',{event:'sync'},()=>on.presence(ch.presenceState()));
 ch.subscribe(s=>onStatus(s));return ch;}
const send=(ch,event,payload)=>{try{ch&&ch.send({type:'broadcast',event,payload});}catch(e){}};
/* ---------- v32 CR-02: server-signed seats ----------
 Each phone makes its own key. nr-gn signs {code,pid,role,pub,exp}. Peers check that
 signature, then each message's signature, so nobody can answer as someone else or fake the
 host. If nr-gn is not deployed yet, the game runs in the old unsigned mode. */
const EC={name:'ECDSA',namedCurve:'P-256'},ES={name:'ECDSA',hash:'SHA-256'},TE=new TextEncoder();
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=s=>{s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0));};
const pubKey=j=>crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:j.x,y:j.y},EC,false,['verify']);
async function gnVerify(key,text,sig){try{return await crypto.subtle.verify(ES,key,ub64(sig),TE.encode(text));}catch(e){return false;}}
async function gnSign(sec,text){return b64u(await crypto.subtle.sign(ES,sec.key,TE.encode(text)));}
async function gnClaim(code,role){try{if(!crypto.subtle)return null;
 const kp=await crypto.subtle.generateKey(EC,true,['sign','verify']);const pj=await crypto.subtle.exportKey('jwk',kp.publicKey);
 const r=await fetch(CFG.url+'/functions/v1/nr-gn',{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.key},body:JSON.stringify(role==='host'?{action:'register',code,pub:{kty:'EC',crv:'P-256',x:pj.x,y:pj.y}}:{action:'claim',code,role,pub:{kty:'EC',crv:'P-256',x:pj.x,y:pj.y}})});
 /* v33: 404/409/410 mean the signed-seat server is up but says no; never fall back to unsigned for those */
 if(r.status===429){let ra=0;try{ra=parseInt((await r.json()).retry_after);}catch(x){}const w=Math.min(3600,Math.max(1,ra||parseInt(r.headers.get('Retry-After'))||60));return {err:'rate_limited',wait:w};}
 if(r.status===404||r.status===409||r.status===410){let e='';try{e=(await r.json()).error;}catch(x){}return {err:e||String(r.status)};}
 if(!r.ok)return null;const j=await r.json();if(!j||!j.ok)return null;
 return {rt:j.rt||'',key:kp.privateKey,jwk:await crypto.subtle.exportKey('jwk',kp.privateKey),claim:j.claim,sig:j.sig,srvJ:j.srv,srv:await pubKey(j.srv),pid:JSON.parse(j.claim).pid};}catch(e){return null;}}
async function gnRestore(o){try{if(!o||!o.jwk)return null;const key=await crypto.subtle.importKey('jwk',o.jwk,EC,true,['sign']);const c=JSON.parse(o.claim);if(c.exp<now())return null;
 return {key,jwk:o.jwk,claim:o.claim,sig:o.sig,srvJ:o.srvJ,srv:await pubKey(o.srvJ),pid:c.pid};}catch(e){return null;}}
const gnSave=sec=>sec?{jwk:sec.jwk,claim:sec.claim,sig:sec.sig,srvJ:sec.srvJ}:null;
async function gnCheck(sec,claim,sig,code,role){try{if(!(await gnVerify(sec.srv,String(claim),sig)))return null;const c=JSON.parse(claim);
 if(c.code!==code||c.role!==role||!(c.exp>now()))return null;c.key=await pubKey(c.pub);return c;}catch(e){return null;}}
/* host: signed broadcast; player: verify before use */
async function hostSend(event,obj){const ch=H.ch;if(!H.sec){send(ch,event,obj);return;}const st=JSON.stringify(Object.assign({ev:event,seq:++H.seq},obj));
 send(ch,event,{st,s:await gnSign(H.sec,st),c:H.sec.claim,cs:H.sec.sig});}
async function playerOpen(m,event){if(!P.sec)return m;if(!m||typeof m.st!=='string')return null;
 const c=P.hostC&&P.hostC.raw===m.c?P.hostC:await gnCheck(P.sec,m.c,m.cs,P.me.code,'host');if(!c)return null;
 if(P.hostC&&P.hostC.pid!==c.pid)return null;c.raw=m.c;P.hostC=c;
 if(!(await gnVerify(c.key,m.st,m.s)))return null;const o=JSON.parse(m.st);if(o.ev!==event||(o.seq|0)<=(P.seq|0))return null;P.seq=o.seq;return o;}

/* ---------- screens shared ---------- */
function board(players,me,gains){const L=[...players].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
 return `<ol class="board" id="board">${L.map((p,i)=>`<li class="${p.id===me?'me':''}${p.online===false?' off':''}" data-pid="${esc(p.id)}"><span>${i+1}.</span><span aria-hidden="true">${HERO[p.hero]?HERO[p.hero][2]:'🙂'}</span><span>${esc(p.name)}${p.id===me?' (you)':''}</span>${gains&&gains[p.id]!=null?`<span class="gain">${gains[p.id].ok?'✅ +'+gains[p.id].pts:'❌ +0'}</span>`:''}<span class="pts">${p.score}</span></li>`).join('')}</ol>`;}
function podium(players){const L=[...players].sort((a,b)=>b.score-a.score);const slot=(p,k)=>p?`<div class="pod p${k}"><div class="nm">${HERO[p.hero]?HERO[p.hero][2]:'🙂'} ${esc(p.name)}</div><div class="sc">${p.score} pts</div><div class="blk">${k}</div></div>`:`<div class="pod p${k}"></div>`;
 return `<div class="podium" id="podium">${slot(L[1],2)}${slot(L[0],1)}${slot(L[2],3)}</div>${L.length>3?`<ol class="board" start="4">${L.slice(3).map(p=>`<li>${esc(p.name)}<span class="pts">${p.score}</span></li>`).join('')}</ol>`:''}`;}
function timerBar(id){return `<div class="timer" role="progressbar" aria-label="Time left"><i id="${id}Bar" style="width:100%"></i></div><p class="secs" id="${id}Secs"></p>`;}
let tick=null;
function runTimer(id,deadline,total){clearInterval(tick);const f=()=>{const left=Math.max(0,deadline-now());const b=document.getElementById(id+'Bar'),s=document.getElementById(id+'Secs');if(b)b.style.width=(100*left/total)+'%';if(s)s.textContent=Math.ceil(left/1000)+' s';if(!left)clearInterval(tick);};f();tick=setInterval(f,250);}

/* ---------- home ---------- */
function home(msg){clearInterval(tick);if(window.NR_LOCALONLY){app.innerHTML=`<section class="card" id="gnOffline" role="status"><h2>📴 Game Night is off in offline mode</h2><p>Offline mode keeps everything on this device, and Game Night needs the internet to connect phones, so it is turned off for now.</p><p>Solo play still works. A grown-up can turn offline mode off later.</p><p><a class="btn" id="gnOfflineBack" href="./">🏠 Back to NumiRealm</a></p></section>`;return;}app.innerHTML=`<section class="card" id="gnHome"><h2>🎉 Family Game Night</h2>
 <p>Everyone plays math together, each on their own phone or tablet. Fast right answers win more points!</p>
 ${msg?`<p class="err" id="homeMsg" role="alert">${esc(msg)}</p>`:''}
 <button class="btn" id="joinBtn" type="button">🙋 Join a game</button>
 <button class="btn blue" id="hostBtn" type="button">👪 Host a game (grown-ups)</button>
 <p class="small">No accounts needed. Players only share a nickname, and it disappears when the game ends.</p></section>`;
 document.getElementById('joinBtn').onclick=()=>joinForm();document.getElementById('hostBtn').onclick=gate;}

  app.innerHTML=`<section class="card" id="gnQ">${hdr}<p class="small">Round ${s.round} of ${s.rounds}</p><p class="q" id="qText">${esc(q.text)} = ?</p>${timerBar('pt')}
  ${done?`<p class="big ok" id="locked">🔒 Answer locked in: ${esc(P.picked)}</p><p class="small ctr">Waiting for everyone...</p>`:
   q.choices?`<div class="choices" id="choices">${q.choices.map(c=>`<button class="choice" type="button" data-v="${c}">${c}</button>`).join('')}</div>`:
   `<input id="typeAns" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Your answer" style="font-size:32px;text-align:center"><button class="btn green" id="typeGo" type="button" style="width:100%;margin-top:10px">Send answer</button>`}</section>`;
  runTimer('pt',P.deadline,s.secs*1000);
  const answer=v=>{if(P.picked!=null||now()>P.deadline)return;P.picked=String(v);const a={id:me.id,round:s.round,v:String(v)};if(P.sec)gnSign(P.sec,JSON.stringify([me.code,a.id,a.round,a.v])).then(sg=>send(P.ch,'answer',Object.assign(a,{s:sg})));else send(P.ch,'answer',a);P.key=null;playerDraw();};
  document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b.dataset.v));
  const ti=document.getElementById('typeAns');if(ti){ti.focus();const go=()=>{const v=ti.value.replace(/[^0-9]/g,'');if(v)answer(v);};document.getElementById('typeGo').onclick=go;ti.onkeydown=e=>{if(e.key==='Enter')go();};}
  return;}
 clearInterval(tick);
 if(s.phase==='reveal'){const r=(s.reveal||{})[me.id];app.innerHTML=`<section class="card" id="gnReveal">${hdr}<p class="small">Round ${s.round} of ${s.rounds}</p>
  ${r?`<p class="big ${r.ok?'ok':'err'}" id="myResult">${r.ok?'🎉 Correct! +'+r.pts+' points':r.mine==null?'⏰ Time ran out!':'Almost!'}</p><p class="big" id="rightAns">${esc(r.text)} = ${r.ans}</p>`:''}
  <h3>Leaderboard</h3>${board(s.players,me.id)}${s.last?'<p class="big">🏆 Final scores coming up...</p>':'<p class="small ctr">Next question soon!</p>'}</section>`;return;}
 if(s.phase==='podium'){const L=[...s.players].sort((a,b)=>b.score-a.score);const place=L.findIndex(p=>p.id===me.id)+1;
  app.innerHTML=`<section class="card ctr" id="gnPodium">${hdr}<h2>🏆 Final scores!</h2><p class="big" id="myPlace">${place===1?'🥇 You won!':place?`You finished #${place}. Great job!`:''}</p>${podium(s.players)}
  <button class="btn gray" id="leave" type="button">Leave</button></section>`;
  document.getElementById('leave').onclick=()=>{playerLeave();try{sessionStorage.removeItem(SK);}catch(e){}home();};}}

/* ---------- boot ---------- */
function boot(){
 if(window.NR_LOCALONLY){home();return;} // v33 CR33-4: Game Night stays off in offline mode (no join links, no reconnects)
 if(!FLAG&&!LINKED&&!PORTAL){app.innerHTML=`<section class="card" id="gnOff"><h2>🎉 Family Game Night</h2><p>Coming soon!</p><a class="btn" href="./" style="text-decoration:none">Back to the game</a></section>`;return;}
 document.getElementById('testBanner').hidden=!FLAG;
 document.getElementById('backLink').href='./'+FQ;
 const j=cleanCode(qs.get('join'));const me=loadMe();
 if(me&&me.code&&(!j||j===me.code))playerJoin(me); // reconnect after a reload
 else if(j)joinForm(j);else home();}
boot();
return {gen,choicesFor,cleanName,cleanCode,H,P,MAX,newCode,uid,gnClaim,gnEndRoom,gnCheck,gnSign,gnVerify};
})();
</script>
